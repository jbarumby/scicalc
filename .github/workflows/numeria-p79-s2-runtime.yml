name: NUMERIA P79 S2 Runtime and Patch Recheck
on:
  push:
    branches:
      - numeria-p79-b1-public-replay
    paths:
      - 'NUMERIA_P79_B1_PUBLIC/s2_fixed/**'
      - 'NUMERIA_P79_B1_PUBLIC/prototype_input/p78_s2*'
      - '.github/workflows/numeria-p79-s2-runtime.yml'
  pull_request:
    paths:
      - 'NUMERIA_P79_B1_PUBLIC/s2_fixed/**'
      - 'NUMERIA_P79_B1_PUBLIC/prototype_input/p78_s2*'
      - '.github/workflows/numeria-p79-s2-runtime.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  recertify:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install FLINT
        run: python -m pip install python-flint==0.9.0 mpmath==1.3.0
      - name: Validate parsers and input schema
        run: |
          python -m py_compile NUMERIA_P79_B1_PUBLIC/s2_fixed/*.py
          python - <<'PY'
          import json
          from fractions import Fraction as F
          p=json.load(open('NUMERIA_P79_B1_PUBLIC/prototype_input/p78_s2_table_patch.json'))
          assert p['schema']=='NUMERIA.P78.S2.TABLE.PATCH'
          assert p['default_variant']=='robust'
          assert [x['row'] for x in p['rows']]==list(range(10,17))
          assert all(F(x['b1_new_robust'])>=F(x['b1_new_minimal'])>F(x['b1_old']) for x in p['rows'])
          PY
      - name: Re-certify S2 robust proposed b1 (192 and 256 bits)
        run: |
          python -m NUMERIA_P79_B1_PUBLIC.s2_fixed.p78_s2_recertify_fixed \
            --proposed NUMERIA_P79_B1_PUBLIC/prototype_input/p78_s2_table_patch.json \
            --variant robust --dyadic 192,256 --out s2-robust-certificate.json > s2-robust.log
          tail -n 12 s2-robust.log
      - name: Verify S2 minimal in optimized Python at 192 bits
        run: |
          python -O -m NUMERIA_P79_B1_PUBLIC.s2_fixed.p78_s2_recertify_fixed \
            --proposed NUMERIA_P79_B1_PUBLIC/prototype_input/p78_s2_table_patch.json \
            --variant minimal --dyadic 192 --out s2-minimal-certificate.json > s2-minimal.log
          tail -n 12 s2-minimal.log
      - name: Regress unchanged b4 rows without divide-by-zero
        run: |
          set +e
          python -m NUMERIA_P79_B1_PUBLIC.s2_fixed.p78_s2_recertify_fixed \
            --dyadic 192 --out s2-original-table-diagnostic.json > s2-original-table.log 2>&1
          code=$?
          set -e
          cat s2-original-table.log | tail -n 22
          test "$code" -eq 1
          grep -q 'S2 GATE FAIL: linhas' s2-original-table.log
          python - <<'PY'
          import json
          r=json.load(open('s2-original-table-diagnostic.json'))
          assert r['summary']['mode']=='TABLE_POST_ADOPTION'
          assert r['summary']['rows_checked']==list(range(1,17))
          assert r['summary']['gate_fail_rows']==list(range(10,17))
          assert all(x['model_consistent'] for x in r['rows'])
          print('Expected historical Table failure without 0/0: rows 10-16 only')
          PY
      - name: Scan historical downstream consumers without modifying sources
        run: |
          python -m NUMERIA_P79_B1_PUBLIC.s2_fixed.p78_s2_downstream_scan_fixed \
            --root . --saida s2-downstream-scan.json > s2-downstream.log
          python - <<'PY'
          import json
          s=json.load(open('s2-downstream-scan.json'))
          assert s['schema']=='NUMERIA.P78.S2.DOWNSTREAM.SCAN'
          assert s['summary']['files_scanned']>0
          assert 'nao editar TABLE/P76' in s['summary']['table_updated_hint']
          print('Scanned:',s['summary']['files_scanned'])
          PY
      - name: Check all outward dyadic gates and provenance
        run: |
          python - <<'PY'
          import json
          from fractions import Fraction as Q
          for name, n, label in (
              ('s2-robust-certificate.json', 7, 'robust'),
              ('s2-minimal-certificate.json', 7, 'minimal'),
          ):
              x=json.load(open(name))
              assert x['summary']['all_gates_pass']
              assert x['summary']['rows_checked']==list(range(10,17))
              assert x['variant']==label
              assert len(x['rows'])==n
              for row in x['rows']:
                  for prec, coeff in row['dyadic'].items():
                      m,e=coeff['margin_lower_dyadic']
                      exact=Q(int(m))*(Q(2)**int(e))
                      assert exact>0
                      if label=='robust':
                          assert exact>=Q(1,1000)
                      assert coeff['gate_pass']
              assert x['summary']['model_consistent_all']
          PY
      - name: Hash output
        run: |
          sha256sum NUMERIA_P79_B1_PUBLIC/s2_fixed/*.py NUMERIA_P79_B1_PUBLIC/prototype_input/p78_s2* s2-*.json > s2-sha256sums.txt
      - uses: actions/upload-artifact@v4
        with:
          name: numeria-p79-s2-fixed-recert
          path: |
            s2-robust-certificate.json
            s2-minimal-certificate.json
            s2-original-table-diagnostic.json
            s2-downstream-scan.json
            s2-sha256sums.txt
            s2-robust.log
            s2-minimal.log
            s2-original-table.log
