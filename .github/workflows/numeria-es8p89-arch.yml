name: NUMERIA ES8-P89 rigorous archimedean Fourier enclosures
on:
  pull_request:
    branches: [main]
    paths:
      - 'research/ES8P89/certify_arch_fourier.py'
      - 'research/ES8P89/certify_derivative.py'
      - '.github/workflows/numeria-es8p89-arch.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  proof-and-pilot:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --no-cache-dir python-flint==0.9.0
      - run: python -m py_compile research/ES8P89/certify_derivative.py research/ES8P89/certify_arch_fourier.py
      - name: Rigorous fourth-derivative L1 and infinite Fourier tail
        working-directory: research/ES8P89
        run: |
          mkdir -p evidence
          python certify_derivative.py --out evidence/DERIVATIVE_CERTIFICATE.json
      - name: Rigorous analytic/Fourier pilot (one segment)
        working-directory: research/ES8P89
        run: python certify_arch_fourier.py --shard 0 --shards 8 --pilot-segments 1 --out evidence/PILOT_ARCH.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: numeria-es8p89-arch-proof-pilot
          path: research/ES8P89/evidence/*.json
          if-no-files-found: warn
  segments:
    needs: proof-and-pilot
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        shard: [0,1,2,3,4,5,6,7]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --no-cache-dir python-flint==0.9.0
      - name: Certified 30-segment Fourier-digamma quadrature
        working-directory: research/ES8P89
        env:
          SHARD: ${{ matrix.shard }}
        run: |
          mkdir -p evidence
          python certify_arch_fourier.py --shard "$SHARD" --shards 8 --out "evidence/ARCH_SHARD_${SHARD}.json"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: numeria-es8p89-arch-${{ matrix.shard }}
          path: research/ES8P89/evidence/*.json
          if-no-files-found: warn
