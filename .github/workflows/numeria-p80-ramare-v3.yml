name: NUMERIA P80 Ramaré v1-v3 source and S3 gates
on:
  push:
    branches:
      - numeria-p80-ramare-v3-source-gate
  pull_request:
    paths:
      - 'NUMERIA_P80_SOURCE_GATE/**'
      - '.github/workflows/numeria-p80-ramare-v3.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  certify:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install directed interval library
        run: python -m pip install python-flint==0.9.0 mpmath==1.3.0
      - name: Unit tests exact fractions (normal)
        run: python -m unittest -v NUMERIA_P80_SOURCE_GATE.test_p80
      - name: Unit tests exact fractions (Python -O)
        run: python -O -m unittest -v NUMERIA_P80_SOURCE_GATE.test_p80
      - name: Generate P80 v1-v3 piecewise source audit
        run: python -m NUMERIA_P80_SOURCE_GATE.v3_gate --out p80-v3-source.json
      - name: Reproduce P80 full 16-row S3 with P79 Arb at 192 bits
        run: python -m NUMERIA_P80_SOURCE_GATE.s3_safe --precision 192 --out p80-s3-192.json
      - name: Reproduce P80 full 16-row S3 with P79 Arb at 256 bits
        run: python -m NUMERIA_P80_SOURCE_GATE.s3_safe --precision 256 --out p80-s3-256.json
      - name: Verify exact replay tables and unchanged P79 coefficients
        run: |
          python - <<'PY'
          from fractions import Fraction as F
          import json
          src=json.load(open('p80-v3-source.json'))
          x=json.load(open('p80-s3-192.json'))
          y=json.load(open('p80-s3-256.json'))
          if src['changed_b4_rows']!=[10]:raise AssertionError('v3 changed unexpected rows')
          if x['overlay_patch']!=y['overlay_patch']:raise AssertionError('precision mismatch')
          if x['source_P79_table_sha256']!=y['source_P79_table_sha256']:
              raise AssertionError('P79 baseline shifted')
          if x['source_P79_table_sha256']!='d7ba517b4461e4791ad1ca92d69575d4f973b0d161b5a2a50b928ea2137af615':
              raise AssertionError('P79 source changed')
          if len(x['rows'])!=16:raise AssertionError('incomplete S3')
          if [r['row'] for r in x['rows'] if r['status']=='overlay']!=list(range(10,17)):
              raise AssertionError('incorrect S3 overlay selection')
          if not all(F(r['b4_P80_maximum'])<=F(r['b4_P78']) for r in x['rows']):
              raise AssertionError('P80 bound increases')
          print('P80: v1/v3 16 rows, 1 strict improvement, same P79 table at 192/256 bits.')
          PY
      - name: Reproduce unchanged P79 512-band finite positivity certificate
        run: |
          python -m NUMERIA_P79_B1_PUBLIC.audit_public --precision 256 \
            --out p80-p79-original-b1.json --cover-out p80-p79-512-cover.json \
            --start 18 --end 79 --segments 512
          python - <<'PY'
          import json
          d=json.load(open('p80-p79-512-cover.json'))
          if not (d['status']=='conditional_finite_positive' and
                  d['certified_through_exact']=='79' and
                  d['first_unresolved_cell'] is None and
                  d['cell_count']==4284):
              raise AssertionError('P79 frozen finite coverage not reproduced')
          print('P79 frozen coverage revalidated without replacing historical B1.')
          PY
      - name: Generate SHA-256 provenance
        run: |
          sha256sum NUMERIA_P80_SOURCE_GATE/*.py NUMERIA_P80_SOURCE_GATE/source_input/*.py NUMERIA_P78_RAMARE_PUBLIC/certificate.json p80-*.json > p80-sha256sums.txt
          cat p80-sha256sums.txt
      - uses: actions/upload-artifact@v4
        with:
          name: numeria-p80-v3-s3-source-gates
          path: |
            p80-v3-source.json
            p80-s3-192.json
            p80-s3-256.json
            p80-p79-original-b1.json
            p80-p79-512-cover.json
            p80-sha256sums.txt
