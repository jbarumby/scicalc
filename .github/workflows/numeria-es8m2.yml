name: NUMERIA ES8-M2 full Gaussian moments rational replay
on:
  workflow_dispatch:
  push:
    paths:
      - 'research/2026-11-03/es8m2/**'
      - '.github/workflows/numeria-es8m2.yml'
jobs:
  certified-moments:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Dependencies
        run: python -m pip install mpmath==1.3.0 pytest==8.4.2
      - name: ES8-M2 14 regression tests
        run: python -m pytest -q research/2026-11-03/es8m2/test_es8m2_certify.py
      - name: Recompute complete rational certificate (M=16384)
        run: |
          python research/2026-11-03/es8m2/es8m2_certify.py \
            --M 16384 --T 48 --terms 192 --N 64 \
            --out /tmp/RESULTADOS_ES8M2_REPLAY.json \
            --refs-out /tmp/REFERENCIAS_ES8M2_REPLAY.csv
      - name: Verify exact rational endpoints, positivity, manifest
        run: |
          python - <<'PY'
          import hashlib, json, pathlib
          root=pathlib.Path('research/2026-11-03/es8m2')
          a=json.loads((root/'RESULTADOS_ES8M2.json').read_text())
          b=json.load(open('/tmp/RESULTADOS_ES8M2_REPLAY.json'))
          assert a['schema']==b['schema']
          for aa,bb in zip(a['moments_normalized_by_400_power'],b['moments_normalized_by_400_power']):
              assert aa['interval_rational']==bb['interval_rational']
          for aa,bb in zip(a['hankel_and_stieltjes_2x2'],b['hankel_and_stieltjes_2x2']):
              assert aa['det_rational']==bb['det_rational']
              assert aa['status']==bb['status']=='CERTIFIED_POSITIVE_DEFINITE'
          assert b['references']['n_unique']==19
          assert 'NOT RH proof' in b['status']
          manifest=json.loads((root/'MANIFESTO_SHA256.json').read_text())
          for rel,digest in manifest['files'].items():
              assert hashlib.sha256((root/rel).read_bytes()).hexdigest()==digest,rel
          print('PASS: exact rational replay and 13-file provenance integrity. Finite result only, not RH.')
          PY
