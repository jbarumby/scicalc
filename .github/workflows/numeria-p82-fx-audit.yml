name: NUMERIA P82 FX mean-square independent audit
on:
  push:
    branches:
      - numeria-p82-fx-mean-square-audit
  pull_request:
    paths:
      - 'NUMERIA_P82_FX_AUDIT/**'
      - '.github/workflows/numeria-p82-fx-audit.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  fx-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install mpmath for finite-moment diagnostic
        run: python -m pip install mpmath==1.3.0
      - name: Check exact arithmetic tests and numerical diagnostic
        run: python -m unittest -v NUMERIA_P82_FX_AUDIT.test_fx
      - name: Repeat tests without Python assertions
        run: python -O -m unittest -v NUMERIA_P82_FX_AUDIT.test_fx
      - name: Generate independently built F_X audit record
        run: python -m NUMERIA_P82_FX_AUDIT.fx_audit --out p82-fx-audit.json
      - name: Fail closed on source dependencies and arithmetic mismatches
        run: |
          python - <<'PY'
          import json
          from fractions import Fraction as F
          p=json.load(open('p82-fx-audit.json'))
          assert p['schema']=='NUMERIA.P82.FX.MEAN_SQUARE_AUDIT.1'
          assert len(p['finite_rational_mobius_examples'])==10
          assert len(p['finite_rational_mean_weight_examples'])==6
          assert len(p['finite_rational_tail_examples'])==6
          for case in p['finite_rational_mobius_examples']:
              assert case['all_equalities_exact']
              assert F(case['raw_diagonal'])-F(case['lambda_square_sum'])==1
              assert F(case['raw_diagonal'])==F(case['double_sum_truncation'])
          for case in p['finite_rational_mean_weight_examples']:
              assert F(case['direct'])==F(case['reassembled'])
          assert all(c['combined_satisfied'] for c in p['finite_rational_tail_examples'])
          s=p['status']
          assert s['dirichlet_convolution_proved_algebraically']
          assert s['CS_FX_inequality_derived_conditionally']
          assert not s['KLN_mean_value_theorem_independently_proved']
          assert not s['KLN_b3_short_range_independently_proved']
          assert not s['RZ_S_epsilon_theorems_independently_proved']
          assert not s['Riemann_hypothesis_proved']
          print('P82 PASS: 10 exact convolution tests, 6 KLN regrouping, 6 tail tests.')
          print('External theorem status remains OPEN, no false proof claims.')
          PY
      - name: Source and output SHA-256 manifest
        run: |
          sha256sum NUMERIA_P82_FX_AUDIT/*.py NUMERIA_P81_TRANSFER/transfer.py p82-fx-audit.json > p82-sha256sums.txt
          cat p82-sha256sums.txt
      - uses: actions/upload-artifact@v4
        with:
          name: numeria-p82-fx-arithmetic-audit
          path: |
            p82-fx-audit.json
            p82-sha256sums.txt
