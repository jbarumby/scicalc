name: NUMERIA NL1 ES1 NB1 research checks
on:
  workflow_dispatch:
  push:
    paths:
      - 'research/2026-11-03/**'
      - '.github/workflows/numeria-nl1-es1-nb1.yml'
jobs:
  research-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install mpmath==1.3.0 numpy pytest
      - name: NL1 ES1 unit tests
        run: python -m pytest -q research/2026-11-03/nl1_es1/test_numeria_nl1.py
      - name: NB1 audit tests
        run: python research/2026-11-03/nb1/test_nb1_gram_audit.py
      - name: NL1 numerical reproduction
        run: python research/2026-11-03/nl1_es1/numeria_nl1.py --out /tmp/RESULTADO_NL1_ES1.json --v24 research/2026-11-03/nl1_es1/EXTRATO_V24_COTAS.json
