name: NUMERIA ES3 Spin-Zeta audit
on:
  workflow_dispatch:
  push:
    paths:
      - 'research/2026-11-03/es3/**'
      - '.github/workflows/numeria-es3-spin-zeta.yml'
jobs:
  es3-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install reproducible dependencies
        run: python -m pip install numpy mpmath==1.3.0 sympy==1.14.0 pytest
      - name: Run eight ES3 tests
        run: python -m pytest -q research/2026-11-03/es3/test_es3_spin_zeta.py
      - name: Recompute numerical/symbolic audit
        run: python research/2026-11-03/es3/es3_spin_zeta.py --zeros 20 --train 8 --holdout 6 --out /tmp/RESULTADOS_ES3_REPLAY.json
      - name: Verify scientific status and key outputs
        run: |
          python - <<'PY'
          import json
          p=json.load(open('/tmp/RESULTADOS_ES3_REPLAY.json'))
          assert len(p['spin']['eight_orientations'])==8
          assert len(p['spin']['finite_site_tensor_sum'])==4
          assert len(p['zeta']['positive_ordinates_first_J'])==20
          assert len(p['oscillator']['convergence'])==3
          assert 'not RH proof' in p['scientific_status']
          print('ES3 replay verified; no claim of a RH proof')
          PY
