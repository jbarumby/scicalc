name: NUMERIA ES8-P73 rigorous Arb sample replay
on:
  push:
    branches:
      - research/numeria-es8p73-arb-replay-2026-11-07
    paths:
      - research/ES8P73/**
      - .github/workflows/numeria-es8p73.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Exact rational sample audits
        working-directory: research/ES8P73
        run: python -m unittest -v test_replay.py
  arb-replay:
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Arb bindings
        run: python -m pip install --no-cache-dir python-flint==0.9.0
      - name: Verify flint and digamma special functions
        run: python -c "import flint; from flint import acb; print('flint',flint.__version__,acb(1).digamma())"
      - name: Recompute sample with 256-bit Arb balls
        working-directory: research/ES8P73
        run: python replay_arb.py --historical historical_sample.json --bits 256 --shard ${{ matrix.shard }} --out replay_shard_${{ matrix.shard }}.json
      - name: Upload output for independent inspection
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: numeria-es8p73-replay-${{ matrix.shard }}
          path: research/ES8P73/replay_shard_${{ matrix.shard }}.json
          if-no-files-found: warn
