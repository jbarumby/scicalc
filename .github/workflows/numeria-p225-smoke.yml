name: NUMERIA P225 - Real Arb kernel smoke
on:
  pull_request:
    paths:
      - .github/workflows/numeria-p225-smoke.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  real-arb:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install real python-flint
        run: python -m pip install --no-cache-dir python-flint==0.9.0
      - name: Verify spherical Bessel and digamma enclosures
        shell: bash
        run: |
          python - <<'PY'
          from flint import arb, acb, ctx
          from fractions import Fraction
          import math,json
          ctx.prec=800
          assert __import__('flint').__version__=='0.9.0'
          def anchor(n,x):
              pref=x**n
              for i in range(1,n+1): pref /= arb(2*i+1)
              ak=arb(1); s=arb(0); xx=x*x
              for k in range(700):
                  ratio=Fraction(161**2,2*(k+1)*(2*n+2*k+3))
                  if ratio<=Fraction(1,2) and ak.upper()<arb(10)**-205:
                      return pref*(s+arb(0,(2*ak.upper()).upper())), k
                  s += ak if k%2==0 else -ak
                  ak *= xx/(2*(k+1)*(2*n+2*k+3))
              raise ArithmeticError("anchor not converged")
          def bessel(x):
              u,ku=anchor(400,x);v,kv=anchor(401,x)
              b=[None]*402;b[400]=u;b[401]=v
              for n in range(400,0,-1):b[n-1]=(2*n+1)*b[n]/x-b[n+1]
              return b[:400],[ku,kv]
          vals=[]
          for x in [arb(1)/4096,arb(1)/25,arb(50),arb(160)]:
              b,terms=bessel(x)
              assert b[0].overlaps(x.sin()/x)
              assert b[1].overlaps(x.sin()/(x*x)-x.cos()/x)
              assert b[0].rad().upper()<arb(10)**-46
              assert b[1].rad().upper()<arb(10)**-46
              vals.append({'x':str(x),'terms':terms,'j0':str(b[0]),'j1':str(b[1])})
          bern=[Fraction(1)]
          for n in range(1,49):
              bern.append(-sum((Fraction(math.comb(n+1,k))*bern[k] for k in range(n)),Fraction(0))/(n+1))
          B=[arb(bern[2*k].numerator)/arb(bern[2*k].denominator) for k in range(1,24)]
          E=(arb(4*math.factorial(47))/arb(480**48)).upper()
          psi=[]
          for t in [arb(1)/8,arb(25),arb(150),arb(200)]:
              z=acb(arb(1)/4,t/2);w=z+80;inv=1/w;pow2=inv*inv
              v=w.log()-inv/2
              for k,c in enumerate(B,start=1):
                  v-=c*pow2/(2*k);pow2*=inv*inv
              for k in range(80):v-=1/(z+k)
              value=v.real+arb(0,E)
              assert value.overlaps(z.digamma().real)
              assert value.rad().upper()<arb(10)**-45
              psi.append({'t':str(t),'interval':str(value)})
          with open('P225_REAL_ARB_SMOKE.json','w') as f:
              json.dump({'backend':'python-flint/Arb 0.9.0','precision_bits':800,
                  'status':'REAL_ARB_KERNEL_SMOKE_ONLY_NOT_GL60_CHUNK',
                  'bessel':vals,'digamma':psi,'production_chunks_completed':0},f,indent=2)
          print('PASS Arb smoke: 4 Bessel, 4 digamma, no full matrix claim')
          PY
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: numeria-p225-arb-kernel-smoke
          path: P225_REAL_ARB_SMOKE.json
          if-no-files-found: error