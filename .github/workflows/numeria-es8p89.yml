name: NUMERIA ES8-P89 certified pole and prime integrals (eight centers)
on:
  pull_request:
    branches: [main]
    paths:
      - 'research/ES8P89/**'
      - '.github/workflows/numeria-es8p89.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  preflight:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify Python syntax and rational auditor
        run: |
          python -m py_compile research/ES8P89/*.py
          python - <<'PY'
          import sys,tempfile
          sys.path.insert(0,'research/ES8P89')
          from verify_components import check
          with tempfile.TemporaryDirectory() as d:
            assert check(d)['status']=='FAIL_CLOSED'
          PY
  pilot:
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install verified release
        run: python -m pip install --no-cache-dir python-flint==0.9.0
      - name: Certify pilot 5 pairs using analytic-aware Arb integrals
        working-directory: research/ES8P89
        run: |
          mkdir -p evidence
          python certify_poles_primes.py --shard 0 --shards 8 --bits 256 --out evidence/shard_0.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: numeria-es8p89-0
          path: research/ES8P89/evidence/*.json
          if-no-files-found: warn
  others:
    needs: pilot
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6, 7]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --no-cache-dir python-flint==0.9.0
      - name: Arb rigorous real pole/prime integrals (no archimedean component)
        working-directory: research/ES8P89
        env:
          SHARD: ${{ matrix.shard }}
        run: |
          mkdir -p evidence
          python certify_poles_primes.py --shard "$SHARD" --shards 8 --bits 256 --out "evidence/shard_${SHARD}.json"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: numeria-es8p89-${{ matrix.shard }}
          path: research/ES8P89/evidence/*.json
          if-no-files-found: warn
  validate:
    needs: [pilot,others]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/download-artifact@v4
        with:
          pattern: numeria-es8p89-*
          merge-multiple: true
          path: research/ES8P89/evidence
      - name: Exact dyadic rational endpoint audit of all 36 pairs
        working-directory: research/ES8P89
        run: python verify_components.py evidence --out ES8P89_VERDICT.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: numeria-es8p89-verdict
          path: research/ES8P89/ES8P89_VERDICT.json
          if-no-files-found: warn
