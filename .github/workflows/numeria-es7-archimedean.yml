name: NUMERIA ES7 certified archimedean Gaussian
on:
  workflow_dispatch:
  push:
    paths:
      - 'research/2026-11-03/es7/**'
      - '.github/workflows/numeria-es7-archimedean.yml'
jobs:
  arch-certified:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Dependencies
        run: python -m pip install mpmath==1.3.0 pytest==8.4.2
      - name: Run ES7 interval tests
        run: python -m pytest -q research/2026-11-03/es7/test_es7_archimedean.py
      - name: Recompute ES7 enclosures and derivatives
        run: python research/2026-11-03/es7/es7_archimedean.py --M 8192 --terms 192 --T 48 --out /tmp/RESULTADOS_ES7_REPLAY.json
      - name: Documentary normalization gate versus V24
        run: python research/2026-11-03/es7/es7_v24_gate.py --v24 v24/README_V24.md --es6 research/2026-11-03/es6/es6_weil_gaussian.py --out /tmp/COTEJO_ES7_V24.json
      - name: Verify exact scaled certificates and manifest
        run: |
          python - <<'PY'
          import hashlib,json,pathlib
          folder=pathlib.Path('research/2026-11-03/es7')
          expected=json.loads((folder/'RESULTADOS_ES7.json').read_text())
          actual=json.loads(pathlib.Path('/tmp/RESULTADOS_ES7_REPLAY.json').read_text())
          assert expected['schema']==actual['schema']
          for x,y in zip(expected['cases'],actual['cases']):
              assert x['interval_scaled_exact']==y['interval_scaled_exact']
              assert x['derivative_interval_scaled_exact']==y['derivative_interval_scaled_exact']
          gate=json.loads(pathlib.Path('/tmp/COTEJO_ES7_V24.json').read_text())
          assert gate['matrix_equivalence']=='NOT_ESTABLISHED'
          assert all(gate['lexical_anchors'].values())
          manifest=json.loads((folder/'MANIFESTO_SHA256.json').read_text())
          for name,digest in manifest['files'].items():
              assert hashlib.sha256((folder/name).read_bytes()).hexdigest()==digest, name
          print('ES7 intervals reproduced exactly; V24 identification remains unproven')
          PY
