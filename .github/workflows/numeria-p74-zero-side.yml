name: NUMERIA P74 zero-side replay

on:
  push:
    branches: [numeria-p74-zero-side-certified]
    paths:
      - "NUMERIA_P74_ZERO_SIDE/**"
      - ".github/workflows/numeria-p74-zero-side.yml"
  pull_request:
    branches: [numeria-p73-random-adaptive]
    paths:
      - "NUMERIA_P74_ZERO_SIDE/**"
      - ".github/workflows/numeria-p74-zero-side.yml"

permissions:
  contents: read

jobs:
  replay:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install pinned interval and regression dependencies
        run: python -m pip install python-flint==0.9.0 mpmath==1.3.0
      - name: Check manifests and run both test modes
        run: |
          sha256sum -c NUMERIA_P74_ZERO_SIDE/SHA256SUMS
          python -m unittest NUMERIA_P74_ZERO_SIDE.test_p74 -v
          python -O -m unittest NUMERIA_P74_ZERO_SIDE.test_p74 -v
          (cd NUMERIA_P73_ADAPTIVE && python -m unittest test_p73 -v)
          (cd NUMERIA_P73_ADAPTIVE && python -O -m unittest test_p73 -v)
      - name: Authenticate the 20 zeros and replay P73 at 192 and 256 bits
        run: |
          python -m NUMERIA_P74_ZERO_SIDE.audit_p73 --out "$RUNNER_TEMP/p73-audit.json"
          cmp "$RUNNER_TEMP/p73-audit.json" NUMERIA_P74_ZERO_SIDE/p73_replay.json
      - name: Reproduce deterministic coverage, obstructions and discovery diagnostics
        run: |
          python -m NUMERIA_P74_ZERO_SIDE.experiments --verify NUMERIA_P74_ZERO_SIDE/experiments.json
          python -O -m NUMERIA_P74_ZERO_SIDE.experiments --verify NUMERIA_P74_ZERO_SIDE/experiments.json
          python -m NUMERIA_P74_ZERO_SIDE.discovery --out "$RUNNER_TEMP/discovery.json"
          cmp "$RUNNER_TEMP/discovery.json" NUMERIA_P74_ZERO_SIDE/discovery.json
      - uses: actions/upload-artifact@v4
        with:
          name: numeria-p74-certificate-data
          path: NUMERIA_P74_ZERO_SIDE/*.json
