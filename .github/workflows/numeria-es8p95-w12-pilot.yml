name: NUMERIA ES8-P95 W12 Arb Pilot
on:
  push:
    branches:
      - research/numeria-es8p95-w12-arb-2026-11-08
    paths:
      - .github/workflows/numeria-es8p95-w12-pilot.yml
      - numeria/es8_p95/**
  workflow_dispatch:
permissions:
  contents: read
jobs:
  arb-pilot-w12:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: numeria/es8_p95
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned dependencies
        run: python -m pip install 'python-flint==0.9.0' 'numpy==1.26.4'
      - name: Exact rational GL/Cauchy bounds
        run: python p94_bounds.py
      - name: Arb nodes and polynomial precision smoke-test
        run: |
          python - <<'PY'
          from flint import arb, ctx
          from originais.gauss_legendre_intervalar_flint import gauss_legendre_rule_arb
          ctx.prec=256
          xs,ws=gauss_legendre_rule_arb(12)
          assert len(xs)==len(ws)==12
          for k in range(24):
              target=arb(0) if k%2 else arb(2)/(k+1)
              moment=sum((w*x**k for x,w in zip(xs,ws)),arb(0))
              assert bool(moment.contains(target)), k
          print("CERTIFIED_POLYNOMIAL_GL12_SMOKE_OK")
          PY
      - name: Run Arb one-segment W12 pilot only (NOT full certification)
        run: |
          python p94_arb_fourier_gl.py \
              --shard 0 --shards 8 \
              --pilot-segments 1 --pairs '1,2' --prec 256 \
              --out ES8P95_W12_SEGMENT0.json 2>&1 | tee ES8P95_W12_PILOT.log
          python - <<'PY'
          import json
          x=json.load(open("ES8P95_W12_SEGMENT0.json"))
          assert x["status"]=="PILOT_PARTIAL_SEGMENTS_ONLY"
          assert x["segments"]==[0]
          assert len(x["records"])==1
          print("PILOT_SHARD_FINITE_ONLY_OK")
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ES8P95_W12_PILOT
          path: |
            numeria/es8_p95/ES8P95_W12_SEGMENT0.json
            numeria/es8_p95/ES8P95_W12_PILOT.log
          if-no-files-found: warn
