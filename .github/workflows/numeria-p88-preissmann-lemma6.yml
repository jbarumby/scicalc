name: NUMERIA P88 Preissmann Lemma6 mixed compensation and uniform sharpness
on:
  push:
    branches:
      - numeria-p88-preissmann-lemma6-uniform-sharpness
  pull_request:
    paths:
      - 'NUMERIA_P88_LEMMA6/**'
      - '.github/workflows/numeria-p88-preissmann-lemma6.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  lemma6-mixed:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run exact-Fraction tests
        run: python -m unittest -v NUMERIA_P88_LEMMA6.test_p88
      - name: Run tests without Python assertions
        run: python -O -m unittest -v NUMERIA_P88_LEMMA6.test_p88
      - name: Rebuild exact mixed compensation ledger
        run: python -m NUMERIA_P88_LEMMA6.compensation --out p88-mixed-compensation.json
      - name: Independently recompute witness gates and reject false theorem claims
        run: |
          python - <<'PY'
          from fractions import Fraction as F
          import json
          from NUMERIA_P88_LEMMA6.compensation import (
              reciprocal_kernel_identity,uniform_cross_parts,
              lattice_finite,mixed_balance
          )
          d=json.load(open('p88-mixed-compensation.json'))
          if d['schema']!='NUMERIA.P88.PREISSMANN.LEMMA6.MIXED_COMPENSATION.1':
              raise ArithmeticError('wrong schema')
          for k in ('arbitrary_spacing_sharp_compensation_proved',
                    'independent_full_Preissmann_Lemma6_proved',
                    'RZ_S_epsilon_reproved','RH_proved'):
              if d[k]:
                  raise ArithmeticError('unearned all-N analytic theorem claim: '+k)
          if not (d['uniform_sharp_coefficient_negative_three']
                  and d['universal_relaxed_mixed_inequality_proved']):
              raise ArithmeticError('missing universal mathematical statement')
          for q in d['partial_fraction_examples']:
              z=reciprocal_kernel_identity(q['u'],q['v'])
              if z!=q or F(z['lhs'])!=F(z['rhs']):
                  raise ArithmeticError('partial-fraction mismatch')
          for q in d['uniform_cross_harmonic']:
              if uniform_cross_parts(q['m'])!=q:
                  raise ArithmeticError('lattice harmonic identity mismatch')
          for q in d['finite_lattice_tail_examples']:
              z=lattice_finite(q['m'],q['radius_M'],q['spacing'])
              if q!=z or not(0<F(z['limiting_minus_finite_lower'])<
                                     F(z['limiting_minus_finite_upper'])<=
                                     F(z['positive_tail_upper_exact'])):
                  raise ArithmeticError('lattice tail mismatch')
          count=0
          crossneg=0
          for c in d['finite_mixed_configurations']:
              x=c['configuration']
              nodes=next((r['records'] for r in [c] if r['records']),[])
              for row in nodes:
                  # pair certificates self-validate via exact compensation identity
                  h=F(row['endpoint_distance_exact'])
                  if F(row['compensation_with_pi_lower_exact'])!=h*h*(
                      F(row['sharp_RHS_with_rational_pi_lower'])-
                      F(row['sharp_original_LHS_exact'])):
                      raise ArithmeticError('mixed residual mismatch')
                  if F(row['compensation_with_pi_lower_exact'])<=0:
                      raise ArithmeticError('negative finite witness')
                  if F(row['relaxed_RHS_with_pi_lower'])<F(row['sharp_original_LHS_exact']):
                      raise ArithmeticError('relaxed witness mismatch')
                  crossneg+=F(row['mixed_cross_exact'])<0
                  count+=1
          if count!=d['finite_mixed_pair_count'] or count<700:
              raise ArithmeticError('incomplete finite pair scan')
          if F(d['cross_sign_counterexample']['mixed_cross_exact'])!=-1 or crossneg<=0:
              raise ArithmeticError('missing adverse mixed-sign example')
          print('P88 verified exact finite pairs:',count)
          print('P88 mixed-sign adverse pairs:',crossneg)
          print('P88 all-spacing SHARP Lemma6 remains imported; lattice equality analytic proof in README')
          PY
      - name: Source and JSON SHA256 manifest
        run: |
          sha256sum \
            NUMERIA_P88_LEMMA6/*.py NUMERIA_P88_LEMMA6/README.md \
            NUMERIA_P87_PREISSMANN/shan_spacing.py \
            NUMERIA_P87_PREISSMANN/lemma6_bridge.py \
            NUMERIA_P86_PREISSMANN/spectral_rational.py \
            p88-mixed-compensation.json > p88-SHA256SUMS.txt
          cat p88-SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: numeria-p88-mixed-compensation-lattice-sharpness
          path: |
            p88-mixed-compensation.json
            p88-SHA256SUMS.txt
