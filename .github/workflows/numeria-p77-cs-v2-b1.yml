name: NUMERIA P77 rigorous B1 audit
on:
  push:
    branches:
      - numeria-p77-cs-v2-b1-quadrature
    paths:
      - 'NUMERIA_P77_B1/**'
      - '.github/workflows/numeria-p77-cs-v2-b1.yml'
  pull_request:
    branches:
      - numeria-p76-cs-v2-coefficients
    paths:
      - 'NUMERIA_P77_B1/**'
      - '.github/workflows/numeria-p77-cs-v2-b1.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit-b1:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned FLINT and diagnostic tests
        run: python -m pip install python-flint==0.9.0 mpmath==1.3.0 scipy
      - name: Source manifest and algebraic checks
        run: |
          (cd NUMERIA_P77_B1 && sha256sum -c SHA256SUMS)
          python -m unittest NUMERIA_P77_B1.test_math -v
      - name: Rigorous B1 192-bit proof gate
        run: |
          python -m NUMERIA_P77_B1.audit_b1 --precision 192 --out /tmp/b1-192.json
          python -m unittest NUMERIA_P77_B1.test_flint -v
      - name: Rigorous B1 256-bit proof gate
        run: |
          python -m NUMERIA_P77_B1.audit_b1 --precision 256 --out /tmp/b1-256.json
          python -O -m unittest NUMERIA_P77_B1.test_flint -v
      - name: Preserve both interval certificates
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: NUMERIA-P77-B1-certificates
          path: /tmp/b1-*.json
          if-no-files-found: warn