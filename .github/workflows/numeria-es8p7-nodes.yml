name: NUMERIA ES8-P7 independent nodal audit
on:
  workflow_dispatch:
  push:
    branches: [research/numeria-es8p7-nodes-2026-11-03]
    paths:
      - 'research/2026-11-03/es8p7/**'
      - '.github/workflows/numeria-es8p7-nodes.yml'
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install mpmath==1.3.0 pytest
      - name: Verify pinned source files and all SHA256
        working-directory: research/2026-11-03/es8p7
        run: python check_manifest.py
      - name: Unit tests
        working-directory: research/2026-11-03/es8p7
        run: python -m pytest -q test_es8p7_independent.py
      - name: Recompute all 450 sampled entries
        working-directory: research/2026-11-03/es8p7
        run: |
          python es8p7_independent.py --out RESULTADOS_REPLAY_ES8P7.json
          python - <<'PY'
          import json
          a=json.load(open('RESULTADOS_ES8P7.json'))
          b=json.load(open('RESULTADOS_REPLAY_ES8P7.json'))
          assert a==b, 'Replayed data differs from saved sample audit'
          assert b['statistics']['compared']==450
          assert b['statistics']['incompatible']==0
          print('ES8-P7 replay: PASS, 450/450 intervals')
          PY
