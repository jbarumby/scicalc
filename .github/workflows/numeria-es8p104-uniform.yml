name: NUMERIA ES8-P104 Uniform Arb Parameter Audit
on:
  pull_request:
    branches:
      - research/numeria-es8p102-analytical-audit-2026-11-08
    paths:
      - ".github/workflows/numeria-es8p104-uniform.yml"
      - "numeria/es8_p104/**"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  uniform-parameter-integrals:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    defaults:
      run:
        working-directory: numeria/es8_p104
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install pinned python-flint
        run: python -m pip install "python-flint==0.9.0"
      - name: Run controlled Arb experiments and record library version
        run: python test_p104_uniform_intervals.py 2>&1 | tee P104_TEST_LOG.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: P104_PROVENANCE_AND_TESTS
          path: |
            numeria/es8_p104/P104_ENVIRONMENT.json
            numeria/es8_p104/P104_TEST_LOG.txt
          if-no-files-found: warn
