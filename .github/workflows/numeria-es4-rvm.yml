name: NUMERIA ES4 nonquadratic spectral counting
on:
  workflow_dispatch:
  push:
    paths:
      - 'research/2026-11-03/es4/**'
      - '.github/workflows/numeria-es4-rvm.yml'
jobs:
  counting-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install packages
        run: python -m pip install mpmath==1.3.0 pytest==8.4.2
      - name: Execute ES4 control-model tests
        run: python -m pytest -q research/2026-11-03/es4/test_es4_spectral_count.py
      - name: Reproduce ES4 calculation
        run: python research/2026-11-03/es4/es4_spectral_count.py --zeros 25 --dps 60 --out /tmp/RESULTADOS_ES4_REPLAY.json
      - name: Check independent input and scientific limitations
        run: |
          python - <<'PY'
          import json
          r=json.load(open('/tmp/RESULTADOS_ES4_REPLAY.json'))
          assert r['schema']=='NUMERIA.ES4.SPECTRAL_COUNT_CONTROL.1'
          assert r['j']==25
          assert len(r['model_levels_first_J'])==25
          assert len(r['shifted_operator_adversarial_counts'])==6
          assert 'not RH proof' in r['status']
          assert float(r['rmse_level_error'])>0
          print('ES4 reproduced: spectrum COUNTING ONLY, not a RH proof')
          PY
