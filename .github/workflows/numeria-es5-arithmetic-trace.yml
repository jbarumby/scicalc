name: NUMERIA ES5 arithmetic log-derivative trace
on:
  workflow_dispatch:
  push:
    paths:
      - 'research/2026-11-03/es5/**'
      - '.github/workflows/numeria-es5-arithmetic-trace.yml'
jobs:
  es5-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned dependencies
        run: python -m pip install mpmath==1.3.0 pytest==8.4.2
      - name: Execute unit tests
        run: python -m pytest -q research/2026-11-03/es5/test_es5_arithmetic_trace.py
      - name: Reproduce finite interval audit and gaussian check
        run: python research/2026-11-03/es5/es5_arithmetic_trace.py --N 4096 --sigma 4 --dps 45 --out /tmp/RESULTADOS_ES5_REPLAY.json
      - name: Verify status and provenance
        run: |
          python - <<'PY'
          import json, hashlib
          from pathlib import Path
          base = Path('research/2026-11-03/es5')
          r=json.load(open('/tmp/RESULTADOS_ES5_REPLAY.json'))
          assert r['schema']=='NUMERIA.ES5.ARITHMETIC_LOGDERIVATIVE_TRACE.1'
          assert r['finite_interval_certificate']['overlap_certified']
          assert r['finite_interval_certificate']['N']==4096
          assert r['v24_local_prime_support_certificate']['twice_L']=='9/10'
          assert 'NOT global Weil formula or RH proof' in r['scientific_status']
          m=json.loads((base/'MANIFESTO_SHA256.json').read_text())
          for filename, entry in m['files'].items():
              assert hashlib.sha256((base/filename).read_bytes()).hexdigest() == entry['sha256'], filename
          print('ES5 replay success; exact rational bounds; no RH claim')
          PY
