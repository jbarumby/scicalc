name: NUMERIA ES8M Hankel Stieltjes audit
on:
  workflow_dispatch:
  push:
    paths:
      - 'research/2026-11-03/es8m/**'
      - '.github/workflows/numeria-es8m-hankel-stieltjes.yml'
jobs:
  es8m-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned dependencies
        run: python -m pip install mpmath==1.3.0 pytest==8.4.2
      - name: Run 14 tests
        run: python -m pytest -q research/2026-11-03/es8m/test_es8m_moment_audit.py
      - name: Replay ES8-M analysis
        run: python research/2026-11-03/es8m/es8m_moment_audit.py --zeros 32 --degree 5 --dps 45 --out /tmp/RESULTADOS_ES8M_REPLAY.json
      - name: Verify scope and SHA-256 manifest
        run: |
          python - <<'PY'
          import json,hashlib,pathlib
          root=pathlib.Path('research/2026-11-03/es8m')
          manifest=json.loads((root/'MANIFESTO_SHA256.json').read_text())
          for item in manifest['entries']:
              p=root/item['path']
              assert hashlib.sha256(p.read_bytes()).hexdigest()==item['sha256'],p
          r=json.loads(pathlib.Path('/tmp/RESULTADOS_ES8M_REPLAY.json').read_text())
          assert r['schema']=='NUMERIA.ES8M.MOMENTS_STIELTJES.1'
          for k in ('mu0','mu1'):
              assert r['certified_full_gaussian_low_moments'][k]['certified_positive']
          assert r['gates']['Weil_universal_positivity']=='NOT_PROVED'
          assert r['gates']['Carleman_equivalence_to_RH']=='NOT_ESTABLISHED'
          assert r['gates']['H_n_actual_zeta_for_n_ge_1']=='NOT_CERTIFIED'
          print('PASS: partial moments only, NOT a proof of RH')
          PY
