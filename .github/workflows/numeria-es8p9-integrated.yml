name: NUMERIA ES8-P9 - 30 integrals independently reconstructed
on:
  push:
    branches:
      - 'research/numeria-es8p9-integrated-2026-11-03'
    paths:
      - 'research/2026-11-03/es8p9/**'
      - '.github/workflows/numeria-es8p9-integrated.yml'
  workflow_dispatch:
jobs:
  reproduce:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pytest
        run: python -m pip install pytest
      - name: Verify source SHA-256
        working-directory: research/2026-11-03/es8p9
        run: python check_manifest.py
      - name: Unit tests and mutation controls
        working-directory: research/2026-11-03/es8p9
        run: python -m pytest -q test_es8p9.py
      - name: Recompute ALL 768000 weighted nodal contributions
        working-directory: research/2026-11-03/es8p9
        run: python es8p9_integrate.py --start 0 --end 1600 --batch 50 --digits 35 --terms 128 --out RESULTADOS_ES8P9_REPLAY.json
      - name: Compare all 32 batch hashes and 30 entries
        working-directory: research/2026-11-03/es8p9
        run: python validate_replay.py RESULTADOS_ES8P9_INTEGRAIS.json RESULTADOS_ES8P9_REPLAY.json
      - name: Reconstruct finite projected matrices
        working-directory: research/2026-11-03/es8p9
        run: python es8p9_projected.py --input RESULTADOS_ES8P9_REPLAY.json --out RESULTADOS_ES8P9_PROJECAO_REPLAY.json
