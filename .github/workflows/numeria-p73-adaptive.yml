name: NUMERIA P73 adaptive deterministic replay
on:
  workflow_dispatch:
  pull_request:
    paths:
      - "NUMERIA_P73_ADAPTIVE/**"
      - ".github/workflows/numeria-p73-adaptive.yml"
permissions:
  contents: read
jobs:
  replay:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned FLINT/Arb
        run: python -m pip install python-flint==0.9.0 mpmath==1.3.0
      - name: Reproduce the first 20 zeros using proof-producing Arb
        run: |
          python NUMERIA_P72_ZERO_SIDE/export_zeros_flint.py --n 20 --precision 192 --out "$RUNNER_TEMP/p73_zeros_replay.json"
          cmp "$RUNNER_TEMP/p73_zeros_replay.json" NUMERIA_P72_ZERO_SIDE/arb_zeros_20.json
          printf '%s  %s\n' 'c5993b75a6db7803251655955859cd935f4381b2c0bc20fd77b9f0258bdeddab' 'NUMERIA_P72_ZERO_SIDE/arb_zeros_20.json' | sha256sum -c -
      - name: Replay the exact rational, adaptive cell certificate
        run: |
          python NUMERIA_P73_ADAPTIVE/certify_adaptive.py \
            --zeros NUMERIA_P72_ZERO_SIDE/arb_zeros_20.json \
            --expected-zeros-sha256 c5993b75a6db7803251655955859cd935f4381b2c0bc20fd77b9f0258bdeddab \
            --to 46.6 --out "$RUNNER_TEMP/p73_replay.json"
          cmp "$RUNNER_TEMP/p73_replay.json" NUMERIA_P73_ADAPTIVE/certificate_20_t46.6.json
          python -O NUMERIA_P73_ADAPTIVE/certify_adaptive.py \
            --zeros NUMERIA_P72_ZERO_SIDE/arb_zeros_20.json \
            --expected-zeros-sha256 c5993b75a6db7803251655955859cd935f4381b2c0bc20fd77b9f0258bdeddab \
            --to 46.6 --out "$RUNNER_TEMP/p73_replay_O.json"
          cmp "$RUNNER_TEMP/p73_replay.json" "$RUNNER_TEMP/p73_replay_O.json"
      - name: Reproduce checksums and tests with and without -O
        run: |
          sha256sum -c NUMERIA_P73_ADAPTIVE/SHA256SUMS
          (cd NUMERIA_P73_ADAPTIVE && python -m unittest test_p73 -v)
          (cd NUMERIA_P73_ADAPTIVE && python -O -m unittest test_p73 -v)
      - name: Publish audit output
        uses: actions/upload-artifact@v4
        with:
          name: NUMERIA-P73-RATIONAL-46p6
          path: NUMERIA_P73_ADAPTIVE/certificate_20_t46.6.json
