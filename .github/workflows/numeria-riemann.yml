name: NUMERIA-RIEMANN isolated tests

on:
  push:
    branches:
      - numeria-riemann/explicit-formula-prototype
  pull_request:
    paths:
      - "numeria_riemann/**"
      - ".github/workflows/numeria-riemann.yml"

jobs:
  base-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r numeria_riemann/requirements.txt sympy==1.14.0
      - run: python -m unittest numeria_riemann.test_explicit_formula numeria_riemann.test_backend_compare numeria_riemann.test_number_theory_backends -v

  optional-flint-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r numeria_riemann/requirements.txt sympy==1.14.0 python-flint==0.9.0
      - run: python -m unittest numeria_riemann.test_explicit_formula numeria_riemann.test_backend_compare numeria_riemann.test_number_theory_backends numeria_riemann.test_flint_integration -v

  benchmark-artifact:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r numeria_riemann/requirements.txt
      - name: Run exploratory benchmark
        run: python -m numeria_riemann.benchmark --out benchmark-output --zeros 20 --dps 40 --x 10.5
      - name: Publish benchmark outputs
        uses: actions/upload-artifact@v5
        with:
          name: numeria-riemann-benchmark-${{ github.sha }}
          path: benchmark-output/
          if-no-files-found: error
          retention-days: 30

  weil-interval-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install python-flint==0.9.0
      - name: Test interval arithmetic helpers
        run: python -m unittest numeria_riemann.test_weil_interval_audit -v
      - name: Run N=8 interval audit (baseline mesh)
        run: python -m numeria_riemann.weil_interval_audit --L 0.45 --N 8 --R 160 --step 0.02 --series-terms 128 --precision 192 --out weil-interval-audit-N8.json
      - name: Run N=8 interval audit (finer mesh and higher precision)
        run: python -m numeria_riemann.weil_interval_audit --L 0.45 --N 8 --R 160 --step 0.01 --series-terms 256 --precision 256 --out weil-interval-audit-N8-fine.json
      - name: Publish interval audit reports
        uses: actions/upload-artifact@v5
        with:
          name: numeria-riemann-weil-interval-N8-${{ github.sha }}
          path: |
            weil-interval-audit-N8.json
            weil-interval-audit-N8-fine.json
          if-no-files-found: error
          retention-days: 30
