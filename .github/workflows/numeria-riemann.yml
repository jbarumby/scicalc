name: NUMERIA-RIEMANN isolated tests

on:
  push:
    branches:
      - numeria-riemann/explicit-formula-prototype
  pull_request:
    paths:
      - "numeria_riemann/**"
      - ".github/workflows/numeria-riemann.yml"

jobs:
  base-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r numeria_riemann/requirements.txt sympy
      - run: python -m unittest numeria_riemann.test_explicit_formula numeria_riemann.test_backend_compare numeria_riemann.test_number_theory_backends -v

  optional-flint-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r numeria_riemann/requirements.txt sympy python-flint
      - run: python -m unittest numeria_riemann.test_explicit_formula numeria_riemann.test_backend_compare numeria_riemann.test_number_theory_backends numeria_riemann.test_flint_integration -v
