name: SciCalc Pro checks
on:
  push:
    paths:
      - 'scicalc-pro*'
      - 'scicalc-limit-rational-infinity.js'
      - 'scicalc-lenz-*'
      - 'scicalc-science-*'
      - 'scicalc-number-theory-plus.js'
      - 'scicalc-edo-fourier-plus.js'
      - 'tests/test_science_kernels.mjs'
      - 'tests/test_lenz_studio.mjs'
      - 'tests/test_scicalc_pro.py'
      - 'tests/test_limits_infinity.mjs'
      - '.github/workflows/scicalc-pro.yml'
  pull_request:
    paths:
      - 'scicalc-pro*'
      - 'scicalc-limit-rational-infinity.js'
      - 'ciencia.html'
      - 'tests/test_scicalc_pro.py'
      - '.github/workflows/scicalc-pro.yml'
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install sympy==1.13.3
      - run: python -m unittest discover -s tests -p 'test_scicalc_pro.py' -v
      - run: node --check scicalc-pro.js
      - run: node --check scicalc-pro-worker.mjs
      - run: node --check scicalc-limit-rational-infinity.js
      - run: node --test tests/test_limits_infinity.mjs
      - run: node --check scicalc-lenz-model.js
      - run: node --check scicalc-lenz-studio.js
      - run: node --test tests/test_lenz_studio.mjs
      - run: node --check scicalc-science-kernels.js
      - run: node --check scicalc-number-theory-plus.js
      - run: node --check scicalc-edo-fourier-plus.js
      - run: node --test tests/test_science_kernels.mjs
