name: NUMERIA P75 Chourasiya-Simonic v2 and local curvature
on:
  push:
    branches: [numeria-p75-cs-v2-local-curvature]
    paths:
      - "NUMERIA_P75_CS2/**"
      - ".github/workflows/numeria-p75-cs-v2.yml"
  pull_request:
    branches: [numeria-p74-zero-side-certified]
    paths:
      - "NUMERIA_P75_CS2/**"
      - ".github/workflows/numeria-p75-cs-v2.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install exact versions
        run: python -m pip install python-flint==0.9.0 mpmath==1.3.0
      - name: Verify pinned implementation SHA-256
        run: sha256sum -c NUMERIA_P75_CS2/SHA256SUMS
      - name: Independent exact algebra and Arb gates
        run: |
          python -m unittest NUMERIA_P75_CS2.test_math NUMERIA_P75_CS2.test_flint -v
          python -O -m unittest NUMERIA_P75_CS2.test_math NUMERIA_P75_CS2.test_flint -v
      - name: Run complete deterministic 500-zero window to 79
        run: |
          python -m NUMERIA_P75_CS2.certify --start 18 --end 79 --zeros 500 --precision 256 --segments 128 --mesh 1/64 --out "$RUNNER_TEMP/p75-cs2-79.json"
          python - <<'PY'
          import json, os
          from pathlib import Path
          r=json.loads((Path(os.environ['RUNNER_TEMP'])/'p75-cs2-79.json').read_text())
          print('status:',r['status'],'through:',r['certified_through_exact'],'cells:',r['cell_count'])
          print('margins:',r['minimum'])
          if not r['positive_under_imported_lemmas']:
              raise SystemExit('P75 remains INCONCLUSIVE: no new 79 certification')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: numeria-p75-cs-v2-result
          path: ${{ runner.temp }}/p75-cs2-79.json