name: NUMERIA ES8-P10 - digamma tail and sharper Cauchy interpolation
on:
  push:
    branches:
      - 'research/numeria-es8p10-lemmas-2026-11-03'
    paths:
      - 'research/2026-11-03/es8p10/**'
      - '.github/workflows/numeria-es8p10-lemmas.yml'
  workflow_dispatch:
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install tests
        run: python -m pip install pytest
      - name: Recheck SHA256 input integrity
        working-directory: research/2026-11-03/es8p10
        run: python check_manifest.py
      - name: Exact rational algebra and negative controls
        working-directory: research/2026-11-03/es8p10
        run: python -m pytest -q test_es8p10.py
      - name: Recompute improved interpolation and projected matrices
        working-directory: research/2026-11-03/es8p10
        run: python es8p10_lemmas.py --out RESULTADOS_ES8P10_REPLAY.json
      - name: Compare replay exactly
        working-directory: research/2026-11-03/es8p10
        run: python compare_replay.py
