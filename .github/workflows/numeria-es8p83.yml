name: NUMERIA ES8-P83 independent FLINT component audit
on:
  pull_request:
    branches: [main]
    paths:
      - 'research/ES8P83/**'
      - '.github/workflows/numeria-es8p83.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  independent-special-functions:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Arb engine
        run: python -m pip install --no-cache-dir python-flint==0.9.0
      - name: Independently enclose Bessel/digamma/Legendre nodes and weights
        working-directory: research/ES8P83
        run: python check_flint_components.py ES8P83_COMPONENT_AUDIT.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: numeria-es8p83-flint-component-evidence
          path: research/ES8P83/ES8P83_COMPONENT_AUDIT.json
          if-no-files-found: warn
