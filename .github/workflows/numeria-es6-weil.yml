name: NUMERIA ES6 Gaussian Weil and differential audit
on:
  workflow_dispatch:
  push:
    paths:
      - 'research/2026-11-03/es6/**'
      - '.github/workflows/numeria-es6-weil.yml'
jobs:
  es6-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Python dependencies
        run: python -m pip install mpmath==1.3.0 pytest==8.4.2
      - name: Execute ES6 12 tests
        run: python -m pytest -q research/2026-11-03/es6/test_es6_weil_gaussian.py
      - name: Reproduce Guinand-Weil numeric and differential audit
        run: python research/2026-11-03/es6/es6_weil_gaussian.py --dps 55 --zeros 24 --N 128 --T 128 --out /tmp/RESULTADOS_ES6_REPLAY.json
      - name: Verify mathematical and provenance gates
        run: |
          python - <<'PY'
          import json, hashlib, pathlib
          d=pathlib.Path('research/2026-11-03/es6')
          m=json.loads((d/'MANIFESTO_SHA256.json').read_text())
          for fn,sha in m['files'].items():
              assert hashlib.sha256((d/fn).read_bytes()).hexdigest()==sha, fn
          a=json.loads(pathlib.Path('/tmp/RESULTADOS_ES6_REPLAY.json').read_text())
          assert a['schema']=='NUMERIA.ES6.GAUSSIAN_EXPLICIT_FORMULA.1'
          assert len(a['exploration']['cases'])==2
          assert 'NOT RH proof' in a['scientific_status']
          p=a['finite_prime_interval_certificate']
          assert p['a']=='1/50'
          lo,hi=map(int,p['prime_term_all_n_exact_scaled'])
          assert lo<=hi
          print('ES6: prime interval certified; gaussian full trace only numeric')
          PY
