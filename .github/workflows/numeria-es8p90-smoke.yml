name: NUMERIA ES8-P90 Arb rational-cell smoke
on:
  pull_request:
    branches: [main]
    paths:
      - 'research/ES8P90/**'
      - '.github/workflows/numeria-es8p90-smoke.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  arb-rational-cells:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --no-cache-dir python-flint==0.9.0
      - name: Verify qrat, cell_ball and interval Riemann with Arb 256
        run: python research/ES8P90/smoke_interval.py
