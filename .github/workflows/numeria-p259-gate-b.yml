name: NUMERIA P259 Gate B — odd prefix Arb

on:
  push:
    branches: [numeria-p259-gate-b-full-odd]
    paths:
      - "NUMERIA_ES8P259/gate_b.py"
      - "NUMERIA_ES8P259/test_gate_b.py"
      - ".github/workflows/numeria-p259-gate-b.yml"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  odd-prefix:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pinned Arb dependencies
        run: python -m pip install -r NUMERIA_ES8P249/requirements.txt
      - name: Authenticate P258 original replay
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p replay
          gh run download 44858303395 --repo jbarumby/scicalc -n numeria-p258-certificates -D replay
          printf '%s  %s\n' '1aa765357cfe1fa46f864d5b57fc407157375e75b3fa8b23b77f0db5c2e4985c' replay/P258_GL60.json | sha256sum -c -
          printf '%s  %s\n' '20f86083413bb5fcf3a5faaa05aee035d0a9d015664ba0d5108013beeb21e914' NUMERIA_ES8P253/data/P253_CLOSE504.json.gz | sha256sum -c -
      - name: Fail-closed regression tests
        run: |
          python -m unittest NUMERIA_ES8P259.test_gate_b -v
          python -O -m unittest NUMERIA_ES8P259.test_gate_b -v
      - name: Arb certificate for increasing odd prefixes
        run: |
          python -m NUMERIA_ES8P259.gate_b --p258 replay/P258_GL60.json --max-dimension 128 --bits 1536 --out replay/P259_GATE_B_PREFIX.json
          python - <<'PY'
          import json
          p=json.load(open('replay/P259_GATE_B_PREFIX.json'))
          print('P259 Gate B:',p['status'])
          for q in p['checked_prefixes']:
            print(q['dimension'],q['status'],'negative witness:',q['negative_witness'] is not None)
          PY
          sha256sum replay/P259_GATE_B_PREFIX.json > replay/P259_GATE_B_SHA256SUMS
      - name: Upload bounded-interval certificate
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: numeria-p259-gate-b-odd-prefix
          path: |
            replay/P259_GATE_B_PREFIX.json
            replay/P259_GATE_B_SHA256SUMS
          if-no-files-found: warn
          retention-days: 30
