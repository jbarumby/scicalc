name: NUMERIA ES8-P100 Direct Arb determinant tol 1e-8
on:
  push:
    branches:
      - research/numeria-es8p100-tol1e8-2026-11-08
    paths:
      - .github/workflows/numeria-es8p100-tol1e8.yml
      - numeria/es8_p100/**
  pull_request:
    branches:
      - research/numeria-es8p99-epsilon-2x2-2026-11-08
    paths:
      - .github/workflows/numeria-es8p100-tol1e8.yml
      - numeria/es8_p100/**
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tighter-direct-2x2:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        bits: [128, 256]
    defaults:
      run:
        working-directory: numeria/es8_p99
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned interval library
        run: python -m pip install 'python-flint==0.9.0'
      - name: Verify executable and audit scripts compile
        run: python -m py_compile W12_arb_direto_P98.py certifica_matriz_2x2_P98.py auditar_uma_execucao.py
      - name: Direct Arb W11 W22 W12 with tighter tolerance
        env:
          BITS: ${{ matrix.bits }}
        run: |
          set +e
          python certifica_matriz_2x2_P98.py \
            --eps-den 2048 \
            --prec "$BITS" \
            --tol 1e-8 \
            --eval-limit 60000 \
            --depth-limit 40 \
            --output "P100_TOL1E8_EPS2048_BITS${BITS}.json" \
            > "P100_TOL1E8_EPS2048_BITS${BITS}.log" 2>&1
          code=$?
          set -e
          if [ "$code" -ne 0 ] && [ "$code" -ne 2 ]; then
            tail -70 "P100_TOL1E8_EPS2048_BITS${BITS}.log"
            exit "$code"
          fi
          python auditar_uma_execucao.py "P100_TOL1E8_EPS2048_BITS${BITS}.json" 2048 "$BITS" \
            > "P100_TOL1E8_EPS2048_BITS${BITS}_AUDIT.json"
          python - "$BITS" <<'PY'
          import json,sys
          bits=sys.argv[1]
          d=json.load(open(f"P100_TOL1E8_EPS2048_BITS{bits}_AUDIT.json"))
          print("AUDIT_STATUS:",d["status"])
          for name in ["W11","W22","W12"]:
              e=d["entries"][name]
              print(name,"LOWER",e["lo_float"],"UPPER",e["hi_float"],
                    "WIDTH",e["width_float"])
          print("DETERMINANT_LOWER:",d["determinant_lower"])
          print("DETERMINANT_CERTIFIED_POSITIVE:",d["determinant_lower_positive"])
          PY
      - name: Preserve output, logs and rational audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: P100_TOL1E8_EPS2048_BITS${{ matrix.bits }}
          path: |
            numeria/es8_p99/P100_TOL1E8_EPS2048_BITS*.json
            numeria/es8_p99/P100_TOL1E8_EPS2048_BITS*.log
          if-no-files-found: warn
