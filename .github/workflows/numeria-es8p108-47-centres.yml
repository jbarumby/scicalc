name: NUMERIA ES8-P108 47-centre Arb GL/Cauchy eps 1e-11
on:
  pull_request:
    branches:
      - research/numeria-es8p106-gl-cauchy-certified-2026-11-08
    paths:
      - ".github/workflows/numeria-es8p108-47-centres.yml"
      - "numeria/es8_p108/**"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  arb-row-shards:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        slice: ["0-5","5-10","10-15","15-20","20-25","25-30","30-35","35-40","40-44","44-47"]
    defaults:
      run:
        working-directory: numeria/es8_p108
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Python Arb
        run: python -m pip install 'python-flint==0.9.0'
      - name: Inspect code syntax
        run: python -m py_compile p108_certify.py
      - name: Execute an Arb GL/Cauchy row shard at epsilon=1e-11
        env:
          SLICE: ${{ matrix.slice }}
        run: |
          set -euo pipefail
          IFS='-' read -r FIRST LAST <<< "$SLICE"
          python -u p108_certify.py \
            --bits 256 --row-start "$FIRST" --row-end "$LAST" \
            --out "P108_ROWS_${FIRST}_${LAST}.json" \
            2>&1 | tee "P108_ROWS_${FIRST}_${LAST}.log"
      - name: Archive shard inputs and full geometric proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: P108_SHARD_${{ matrix.slice }}
          path: |
            numeria/es8_p108/P108_ROWS_*.json
            numeria/es8_p108/P108_ROWS_*.log
          if-no-files-found: warn
  exact-matrix-audit:
    needs: arb-row-shards
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: numeria/es8_p108
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Numerical candidate generation only
        run: python -m pip install 'numpy==2.2.6'
      - uses: actions/download-artifact@v4
        with:
          pattern: P108_SHARD_*
          merge-multiple: true
          path: numeria/es8_p108
      - name: Exact rational enclosure and Bareiss PD test for every prefix
        run: |
          set -euo pipefail
          python -u p108_exact_audit.py 2>&1 | tee P108_AUDIT_LOG.txt
      - name: Preserve audit, JSON, trend, logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: P108_EXACT_MATRIX_AND_LAMBDA_TREND
          path: |
            numeria/es8_p108/P108_47X47_EXACT_AUDIT.json
            numeria/es8_p108/P108_LAMBDA_TREND.csv
            numeria/es8_p108/P108_REPORT.md
            numeria/es8_p108/P108_AUDIT_LOG.txt
          if-no-files-found: warn
