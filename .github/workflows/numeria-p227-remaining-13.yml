name: NUMERIA P227 - Remaining 13 independent Arb08 full chunks
on:
  pull_request:
    paths:
      - .github/workflows/numeria-p227-remaining-13.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  independent-v08-chunks:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      max-parallel: 7
      matrix:
        include:
          - {sector: even, start: 50, stop: 100}
          - {sector: even, start: 100, stop: 150}
          - {sector: even, start: 150, stop: 200}
          - {sector: even, start: 200, stop: 250}
          - {sector: even, start: 250, stop: 300}
          - {sector: even, start: 300, stop: 350}
          - {sector: even, start: 350, stop: 400}
          - {sector: odd, start: 0, stop: 50}
          - {sector: odd, start: 50, stop: 100}
          - {sector: odd, start: 100, stop: 150}
          - {sector: odd, start: 150, stop: 200}
          - {sector: odd, start: 200, stop: 250}
          - {sector: odd, start: 250, stop: 300}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install --no-cache-dir python-flint==0.8.0
      - name: Compute independent native Bessel and digamma 50-panel chunk
        run: |
          python -u numeria/p227_chunk_arb08.py --sector ${{ matrix.sector }} --start ${{ matrix.start }} --stop ${{ matrix.stop }} --bits 1024 --out chunk.json.gz
      - name: Validate structure
        run: |
          python - <<'PY'
          import gzip,json
          with gzip.open('chunk.json.gz','rt') as f:d=json.load(f)
          assert d['version']=='0.8.0' and d['bits']==1024
          assert d['modes']==200 and d['nodes']==3000 and d['entries_count']==20100
          assert not d['quadrature_error_added'] and not d['beta_and_poles_added']
          ent=d['entries']
          assert len(ent)==20100
          assert ent[0][:2]==[0,0] and ent[-1][:2]==[199,199]
          print('PASS chunk shape',d['sector'],d['panel_range'])
          PY
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: P227-ARB08-${{ matrix.sector }}-${{ matrix.start }}-${{ matrix.stop }}
          path: chunk.json.gz
          if-no-files-found: error