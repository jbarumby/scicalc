name: NUMERIA ES8-P114 fast integer FLINT 169x169 charpoly audit
on:
  pull_request:
    branches:
      - research/numeria-es8p111-full-169-tight-2026-11-08
    paths:
      - ".github/workflows/numeria-es8p114-fast-flint.yml"
      - "numeria/es8_p114/**"
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  exact-charpoly:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - bound: 500
            parent_run: 42491507777
          - bound: 1000
            parent_run: 42491507667
    defaults:
      run:
        working-directory: numeria/es8_p114
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Pin exact algebra implementation
        run: python -m pip install 'python-flint==0.9.0'
      - name: Download original Arb input and exact audit
        uses: actions/download-artifact@v4
        with:
          run-id: ${{ matrix.parent_run }}
          github-token: ${{ github.token }}
          name: P109_${{ matrix.bound }}_FIXED_MATRIX_CERTIFICATE
          path: numeria/es8_p114
      - name: Fast exact positive characteristic polynomial coefficient test
        env:
          BOUND: ${{ matrix.bound }}
        run: |
          set -euo pipefail
          python -m py_compile p114_flint_charpoly.py
          python -u p114_flint_charpoly.py \
             --bound "$BOUND" \
             --input-zip "P109_${BOUND}_FIXED_MATRIX_CERTIFICATE.zip" \
             --out "P114_${BOUND}_FLINT_EXACT.json" \
             2>&1 | tee "P114_${BOUND}_FLINT_LOG.txt"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: P114_${{ matrix.bound }}_EXACT_FAST_FLINT
          path: |
            numeria/es8_p114/P114_*_FLINT_EXACT.json
            numeria/es8_p114/P114_*_CHARPOLY_SIGNED_COEFFS.txt
            numeria/es8_p114/P114_*_FLINT_LOG.txt
          if-no-files-found: warn
