name: NUMERIA ES8-P8 full nodal crosscheck
on:
  workflow_dispatch:
  push:
    branches: [research/numeria-es8p8-exhaustive-nodes-2026-11-03]
    paths:
      - 'research/2026-11-03/es8p8/**'
      - '.github/workflows/numeria-es8p8-exhaustive-nodes.yml'
jobs:
  full-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install pytest mpmath==1.3.0
      - name: Verify sources and file SHA-256 manifest
        working-directory: research/2026-11-03/es8p8
        run: python check_manifest.py
      - name: Unit and negative-control tests
        working-directory: research/2026-11-03/es8p8
        run: python -m pytest -q test_es8p8_full.py
      - name: Recalculate all 768000 interval intersections
        working-directory: research/2026-11-03/es8p8
        run: |
          python -u es8p8_full.py --start 0 --end 1600 --chunk 50 --terms 128 --out RESULTADOS_ES8P8_REPLAY.json
          python validate_replay.py RESULTADOS_ES8P8.json RESULTADOS_ES8P8_REPLAY.json
