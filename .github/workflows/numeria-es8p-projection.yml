name: NUMERIA ES8-P Weil projection and bibliography gates
on:
  workflow_dispatch:
  push:
    paths:
      - 'research/2026-11-03/es8p/**'
      - '.github/workflows/numeria-es8p-projection.yml'
jobs:
  es8p-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned math dependencies
        run: python -m pip install mpmath==1.3.0 sympy==1.14.0 pytest==8.4.2
      - name: Run eighteen audited tests
        run: python -m pytest -q research/2026-11-03/es8p/test_es8p_projection.py
      - name: Recompute model and bibliography
        run: |
          python research/2026-11-03/es8p/es8p_projection.py --out /tmp/RESULTADOS_ES8P_REPLAY.json
          python research/2026-11-03/es8p/triage_references.py --source research/2026-11-03/es8p/REFERENCIAS_ORIGINAIS_9.csv --out /tmp/REFERENCIAS_TRIADAS_REPLAY.csv
      - name: Verify byte identity and strict scientific gates
        run: |
          python - <<'PY'
          import json,hashlib,pathlib
          base=pathlib.Path('research/2026-11-03/es8p')
          manifest=json.loads((base/'MANIFESTO_SHA256.json').read_text())
          for f in manifest['files']:
              assert hashlib.sha256((base/f['path']).read_bytes()).hexdigest()==f['sha256'],f['path']
          assert pathlib.Path('/tmp/REFERENCIAS_TRIADAS_REPLAY.csv').read_bytes()==(base/'REFERENCIAS_TRIADAS_ES8P.csv').read_bytes()
          r=json.loads(pathlib.Path('/tmp/RESULTADOS_ES8P_REPLAY.json').read_text())
          assert r['schema']=='NUMERIA.ES8P.MODE_PROJECTION_AND_V24_BOUND.1'
          assert len(r['model_error_projection'])==9
          assert all(x['identity_zero_for_both_pole_moments'] for v in r['pole_projection_algebra'].values() for x in v)
          assert 'POINTWISE_MISMATCH' in r['cross_parity_archimedean_gate']['mathematical_gate']
          assert 'NOT' in r['open_gates'][0] or 'Fix/prove' in r['open_gates'][0]
          assert 'NOT matrix-positivity certificate' in r['scientific_status']
          print('ES8-P audit replay PASS; kernel convention mismatch is an unresolved gate; RH remains open.')
          PY
