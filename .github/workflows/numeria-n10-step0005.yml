name: NUMERIA-RIEMANN N10 step 0.005
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/numeria-n10-step0005.yml'
      - 'numeria_riemann/weil_interval_audit.py'
      - 'numeria_riemann/test_weil_interval_audit.py'
      - 'numeria_riemann/audit_diagnostics.py'
jobs:
  n10-refined:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Arb backend
        run: python -m pip install python-flint==0.9.0
      - name: Verify helpers
        run: python -m unittest numeria_riemann.test_weil_interval_audit -v
      - name: N10 finer mesh (32000 cells)
        run: |
          mkdir -p results
          python -m numeria_riemann.weil_interval_audit --archimedean rangesum --L 0.45 --N 10 --R 160 --step 0.005 --series-terms 256 --precision 256 --out results/weil-interval-audit-N10-step0005.json
      - name: Summarize pivot widths and certification status
        run: |
          python -m numeria_riemann.audit_diagnostics results/weil-interval-audit-N10-step0005.json --out results/diagnostics-N10-step0005.md
          cat results/diagnostics-N10-step0005.md >> "$GITHUB_STEP_SUMMARY"
      - name: Upload results even when inconclusive
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: numeria-N10-step0005
          path: results/
          if-no-files-found: warn
