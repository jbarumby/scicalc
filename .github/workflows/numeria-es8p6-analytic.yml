name: NUMERIA ES8-P6 analytic audit
on:
  workflow_dispatch:
  push:
    branches:
      - 'research/numeria-es8p6-*'
    paths:
      - 'research/2026-11-03/es8p6/**'
      - '.github/workflows/numeria-es8p6-analytic.yml'
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install pytest==9.0.2
      - run: python research/2026-11-03/es8p6/check_manifest.py
      - run: python -m pytest -q research/2026-11-03/es8p6/test_es8p6_independent.py
        env:
          PYTHONDONTWRITEBYTECODE: '1'
      - name: Prove local fixture scope only
        run: |
          python - <<'PY'
          from pathlib import Path
          import json
          d=json.loads(Path('research/2026-11-03/es8p6/FIXTURE_FASE4_ES8P6.json').read_text())
          assert d['pairs']==30 and 'NODES_NOT_RECOMPUTED' in d['status']
          assert len(d['historical_e7_tail_comparisons'])==2
          print('REPLAY FIXTURE ONLY; original Phase4/E7 binary ZIPs not opened by CI')
          PY
