name: NUMERIA NL1 ES1 finite-model audit
on:
  workflow_dispatch:
  push:
    paths:
      - 'numeria_nl1.py'
      - 'test_numeria_nl1.py'
      - 'EXTRATO_V24_COTAS.json'
      - '.github/workflows/numeria-nl1-es1.yml'
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install mpmath==1.3.0 pytest
      - run: python -m pytest -q test_numeria_nl1.py
      - run: python numeria_nl1.py --out RESULTADO_NL1_ES1.json --v24 EXTRATO_V24_COTAS.json
