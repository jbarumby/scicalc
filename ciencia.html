<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>SciCalc — Cálculo & Física</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<script src="https://cdn.jsdelivr.net/npm/nerdamer@1.1.13/nerdamer.core.js"></script>
<script src="https://cdn.jsdelivr.net/npm/nerdamer@1.1.13/Algebra.js"></script>
<script src="https://cdn.plot.ly/plotly-2.32.0.min.js"></script>
<style>
  :root{--bg:#f4f6fb;--panel:#fff;--ink:#1a2238;--muted:#6b7390;--primary:#4f46e5;--primary-2:#7c3aed;--accent:#06b6d4;--ok:#10b981;--warn:#f59e0b;--err:#ef4444;--border:#e5e7eb;--shadow:0 8px 24px rgba(30,41,80,.08);--radius:14px}
  *{box-sizing:border-box}
  body{margin:0;font-family:'Segoe UI',system-ui,sans-serif;background:linear-gradient(135deg,#eef2ff 0%,#f4f6fb 50%,#ecfeff 100%);color:var(--ink);min-height:100vh}
  header{background:linear-gradient(120deg,var(--primary),var(--primary-2));color:#fff;padding:22px 32px;box-shadow:var(--shadow)}
  header h1{margin:0;font-size:1.7rem}
  header p{margin:4px 0 0;opacity:.9;font-size:.95rem}
  .tabs{display:flex;flex-wrap:wrap;gap:6px;padding:14px 24px;background:#fff;border-bottom:1px solid var(--border);position:sticky;top:0;z-index:10}
  .tab{padding:10px 18px;border:none;background:transparent;cursor:pointer;border-radius:10px;font-weight:600;color:var(--muted);font-size:.92rem;transition:all .2s}
  .tab:hover{background:#eef2ff;color:var(--primary)}
  .tab.active{background:linear-gradient(120deg,var(--primary),var(--primary-2));color:#fff;box-shadow:0 4px 12px rgba(79,70,229,.3)}
  main{padding:28px;max-width:1200px;margin:0 auto}
  .panel{background:var(--panel);border-radius:var(--radius);padding:24px;box-shadow:var(--shadow);margin-bottom:20px}
  .panel h2{margin:0 0 6px;font-size:1.3rem;background:linear-gradient(90deg,var(--primary),var(--primary-2));-webkit-background-clip:text;-webkit-text-fill-color:transparent}
  .panel .sub{color:var(--muted);font-size:.9rem;margin-bottom:18px}
  .form-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px;margin-bottom:14px}
  label{display:block;font-size:.85rem;font-weight:600;margin-bottom:6px;color:var(--ink)}
  input,select{width:100%;padding:10px 12px;border:1.5px solid var(--border);border-radius:10px;font-size:.95rem;font-family:inherit;transition:all .2s;background:#fafbff}
  input:focus,select:focus{outline:none;border-color:var(--primary);box-shadow:0 0 0 3px rgba(79,70,229,.15);background:#fff}
  .btn{padding:11px 22px;border:none;border-radius:10px;cursor:pointer;font-weight:600;font-size:.95rem;transition:all .2s;background:linear-gradient(120deg,var(--primary),var(--primary-2));color:#fff;box-shadow:0 4px 12px rgba(79,70,229,.25)}
  .btn:hover{transform:translateY(-1px);box-shadow:0 6px 18px rgba(79,70,229,.35)}
  .btn.accent{background:linear-gradient(120deg,var(--accent),#0891b2)}
  .btn.danger{background:linear-gradient(120deg,var(--err),#dc2626)}
  .result{margin-top:18px;padding:16px;border-radius:12px;background:linear-gradient(135deg,#eef2ff,#ecfeff);border-left:4px solid var(--primary);font-size:1rem}
  .result strong{color:var(--primary)}
  .result .math{font-family:'Cambria Math','Times New Roman',serif;font-size:1.15rem}
  .step-box{margin-top:18px;padding:16px;border-radius:12px;background:#fffbeb;border-left:4px solid #f59e0b;font-size:.95rem;line-height:1.7}
  .step-box h3{margin-top:0;color:#b45309;font-size:1.1rem}
  .step-box p{margin:8px 0}
  .step-box code{background:#fef3c7;padding:2px 6px;border-radius:4px;font-family:monospace;color:#92400e}
  .step-box .step-num{font-weight:700;color:#b45309}
  .wolfram-step{background:#f0f9ff;border-left:4px solid #06b6d4;padding:12px;margin:10px 0;border-radius:8px}
  .wolfram-step .title{font-weight:700;color:#0891b2;margin-bottom:6px}
  .wolfram-step .formula{font-family:'Cambria Math',serif;background:#fff;padding:8px;border-radius:4px;margin:6px 0}
  .plot{width:100%;height:380px;margin-top:14px;border-radius:12px;background:#fafbff}
  .tab-content{display:none;animation:fade .3s}
  .tab-content.active{display:block}
  @keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
  .toast-wrap{position:fixed;top:20px;right:20px;z-index:1000;display:flex;flex-direction:column;gap:10px}
  .toast{padding:12px 18px;border-radius:10px;color:#fff;font-weight:500;box-shadow:0 8px 20px rgba(0,0,0,.15);min-width:260px;animation:slide .3s;display:flex;align-items:center;gap:10px}
  .toast.err{background:linear-gradient(120deg,var(--err),#dc2626)}
  .toast.warn{background:linear-gradient(120deg,var(--warn),#d97706)}
  .toast.ok{background:linear-gradient(120deg,var(--ok),#059669)}
  @keyframes slide{from{transform:translateX(120%)}to{transform:none}}
  .sub-tabs{display:flex;gap:8px;margin-bottom:18px;flex-wrap:wrap}
  .sub-tab{padding:8px 14px;border:1.5px solid var(--border);background:#fff;border-radius:8px;cursor:pointer;font-size:.88rem;font-weight:600;color:var(--muted);transition:all .2s}
  .sub-tab.active{background:var(--primary);color:#fff;border-color:var(--primary)}
  .sub-panel{display:none}
  .sub-panel.active{display:block}
  table{width:100%;border-collapse:collapse;margin-top:10px;font-size:.9rem}
  th,td{padding:10px 12px;text-align:left;border-bottom:1px solid var(--border)}
  th{background:#f4f6fb;font-weight:600;color:var(--primary)}
  tr:hover td{background:#fafbff}
  .history-actions{display:flex;gap:10px;margin-bottom:14px;flex-wrap:wrap}
  .chip{display:inline-block;padding:3px 10px;background:#eef2ff;color:var(--primary);border-radius:20px;font-size:.78rem;font-weight:600}
  .grid-2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
  @media(max-width:720px){.grid-2{grid-template-columns:1fr}}
</style>
</head>
<body>
<header>
  <h1>🧮 SciCalc — Cálculo & Física</h1>
  <p>Software científico estilo WolframAlpha · Limites · Derivadas · Integrais</p>
</header>

<nav class="tabs" id="tabs">
  <button class="tab active" data-tab="limites">📐 Limites</button>
  <button class="tab" data-tab="derivadas">📈 Derivadas</button>
  <button class="tab" data-tab="integrais">∫ Integrais</button>
  <button class="tab" data-tab="simuladores">🚀 Simuladores</button>
  <button class="tab" data-tab="historico"> Histórico</button>
</nav>

<main>

<section class="tab-content active" id="limites">
  <div class="panel">
    <h2>📐 Cálculo de Limites</h2>
    <p class="sub">Cálculo numérico preciso.</p>
    <div class="form-row">
      <div><label>Função f(x)</label><input id="lim-f" placeholder="Ex: (tan(x)-x)/(x-sin(x))"></div>
      <div><label>x tende a</label><input id="lim-a" placeholder="Ex: 0, inf"></div>
    </div>
    <button class="btn" onclick="calcLimite()">Calcular</button>
    <div id="lim-result"></div>
    <div id="lim-plot" class="plot"></div>
  </div>
</section>

<section class="tab-content" id="derivadas">
  <div class="panel">
    <h2>📈 Derivadas (Estilo WolframAlpha)</h2>
    <p class="sub">Derivação simbólica com passo a passo.</p>
    <div class="form-row">
      <div><label>Função f(x)</label><input id="der-f" placeholder="Ex: 3*x^2 + 2*x + 1"></div>
      <div><label>Variável</label><input id="der-var" value="x"></div>
    </div>
    <button class="btn" onclick="calcDerivada()">Calcular Derivada</button>
    <div id="der-result"></div>
    <div id="der-steps"></div>
  </div>
</section>

<section class="tab-content" id="integrais">
  <div class="panel">
    <h2>∫ Integrais</h2>
    <p class="sub">Integral definida numérica.</p>
    <div class="form-row">
      <div><label>Função f(x)</label><input id="int-f" placeholder="Ex: x^2"></div>
      <div><label>x₁</label><input id="int-x1" placeholder="0"></div>
      <div><label>x₂</label><input id="int-x2" placeholder="10"></div>
    </div>
    <button class="btn" onclick="calcIntegral()">Calcular</button>
    <div id="int-result"></div>
  </div>
</section>

<section class="tab-content" id="simuladores">
  <div class="panel">
    <h2>🚀 Simuladores</h2>
    <div class="sub-tabs">
      <button class="sub-tab active" data-sub="mhs">MHS</button>
      <button class="sub-tab" data-sub="obl">Lançamento</button>
    </div>
    <div class="sub-panel active" id="sub-mhs">
      <div class="form-row">
        <div><label>A</label><input id="mhs-a" value="1"></div>
        <div><label>ω</label><input id="mhs-w" value="2"></div>
        <div><label>φ</label><input id="mhs-p" value="0"></div>
      </div>
      <button class="btn" onclick="simMHS()">Simular</button>
      <div id="mhs-plot" class="plot"></div>
    </div>
    <div class="sub-panel" id="sub-obl">
      <div class="form-row">
        <div><label>v₀</label><input id="obl-v" value="30"></div>
        <div><label>θ</label><input id="obl-a" value="45"></div>
      </div>
      <button class="btn" onclick="simObl()">Simular</button>
      <div id="obl-plot" class="plot"></div>
    </div>
  </div>
</section>

<section class="tab-content" id="historico">
  <div class="panel">
    <h2>📋 Histórico</h2>
    <div id="hist-list"></div>
  </div>
</section>

</main>

<div class="toast-wrap" id="toasts"></div>

<script>
// Navegação
document.querySelectorAll('.tab').forEach(t=>{
  t.onclick=()=>{
    document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));
    document.querySelectorAll('.tab-content').forEach(x=>x.classList.remove('active'));
    t.classList.add('active');
    document.getElementById(t.dataset.tab).classList.add('active');
  };
});
document.querySelectorAll('.sub-tab').forEach(t=>{
  t.onclick=()=>{
    const p=t.closest('.panel');
    p.querySelectorAll('.sub-tab').forEach(x=>x.classList.remove('active'));
    p.querySelectorAll('.sub-panel').forEach(x=>x.classList.remove('active'));
    t.classList.add('active');
    p.querySelector('#sub-'+t.dataset.sub).classList.add('active');
  };
});

function toast(msg,type='ok'){
  const el=document.createElement('div');
  el.className='toast '+type;
  el.innerHTML=type==='err'?'⚠️':'✅';
  el.innerHTML+=` <span>${msg}</span>`;
  document.getElementById('toasts').appendChild(el);
  setTimeout(()=>el.remove(),3000);
}

function str(id){const v=document.getElementById(id).value.trim();if(!v)throw new Error('Campo vazio');return v;}
function num(id){const v=document.getElementById(id).value.trim().replace(',','.');const n=Number(v);if(!isFinite(n))throw new Error('Inválido');return n;}

// Avaliação numérica
function evalMath(expr,vars={}){
  try{
    let js=expr;
    const funcs={'sin':'Math.sin','cos':'Math.cos','tan':'Math.tan','sqrt':'Math.sqrt','log':'Math.log','exp':'Math.exp','abs':'Math.abs','pi':'Math.PI','e':'Math.E'};
    for(const[f,j]of Object.entries(funcs))js=js.replace(new RegExp('\\b'+f+'\\b','g'),j);
    for(const[k,v]of Object.entries(vars))js=js.replace(new RegExp('\\b'+k+'\\b','g'),'('+v+')');
    js=js.replace(/\^/g,'**');
    return new Function('return '+js)();
  }catch(e){return NaN;}
}

// 🚀 DERIVADA ESTILO WOLFRAMALPHA
function calcDerivada(){
  try{
    const f=str('der-f');
    const varName=str('der-var');
    
    let stepsHTML='<div style="margin-top:20px">';
    
    // Passo 1: Função original
    stepsHTML+=`<div class="wolfram-step">
      <div class="title">📋 Função Original</div>
      <div class="formula">f(${varName}) = ${f}</div>
    </div>`;
    
    // Passo 2: Aplicar derivação termo a termo
    stepsHTML+=`<div class="wolfram-step">
      <div class="title">🔍 Aplicando Regras de Derivação</div>`;
    
    // Tenta derivar com Nerdamer
    let derivadaStr='';
    try{
      const expr=nerdamer(f);
      const deriv=expr.differentiate(varName);
      derivadaStr=deriv.toString();
      
      // Detecta termos e mostra regras
      const termos=f.split(/(?=[+-])/g);
      stepsHTML+='<div style="margin-top:10px">';
      termos.forEach((termo,idx)=>{
        const termoLimpo=termo.trim();
        if(termoLimpo){
          try{
            const exprTermo=nerdamer(termoLimpo);
            const derivTermo=exprTermo.differentiate(varName);
            const derivStr=derivTermo.toString();
            
            // Identifica regra aplicada
            let regra='';
            if(termoLimpo.includes('^')){
              regra='Regra da Potência: d/dx[xⁿ] = n·xⁿ⁻¹';
            }else if(termoLimpo.includes('sin')||termoLimpo.includes('cos')||termoLimpo.includes('tan')){
              regra='Regra Trigonométrica';
            }else if(termoLimpo.includes(varName)){
              regra='Regra Básica';
            }else{
              regra='Derivada de constante = 0';
            }
            
            stepsHTML+=`<div style="margin:8px 0;padding:8px;background:#fff;border-radius:4px">
              <div style="font-size:0.9rem;color:var(--muted)">Termo ${idx+1}: <code>${termoLimpo}</code></div>
              <div style="font-size:0.85rem;color:var(--muted)">${regra}</div>
              <div style="margin-top:4px"><strong>d/d${varName}[${termoLimpo}] = ${derivStr}</strong></div>
            </div>`;
          }catch(e){}
        }
      });
      stepsHTML+='</div>';
    }catch(e){
      stepsHTML+='<div style="color:var(--err)">Erro na derivação simbólica</div>';
    }
    stepsHTML+='</div>';
    
    // Passo 3: Resultado simplificado
    stepsHTML+=`<div class="wolfram-step">
      <div class="title">✅ Resultado Simplificado</div>
      <div class="formula">f'(${varName}) = <strong>${derivadaStr||'não calculável'}</strong></div>
    </div>`;
    
    stepsHTML+='</div>';
    
    document.getElementById('der-steps').innerHTML=stepsHTML;
    document.getElementById('der-result').innerHTML=`
      <div class="result">
        <div class="math">d/d${varName}(${f}) = <strong>${derivadaStr||'...'}</strong></div>
      </div>`;
    
    toast('Derivada calculada!','ok');
  }catch(e){toast(e.message,'err');}
}

// Limite
function calcLimite(){
  try{
    const f=str('lim-f');
    const aStr=str('lim-a').toLowerCase();
    const aVal=aStr==='inf'||aStr==='infinity'?null:Number(aStr);
    
    const deltas=[0.001,0.0001,0.00001];
    const vals=deltas.map(d=>evalMath(f,{x:aVal?aVal+d:1e6})).filter(v=>isFinite(v));
    
    if(vals.length===0)throw new Error('Não calculável');
    
    const L=vals[vals.length-1];
    const rounded=Math.round(L);
    const final=Math.abs(L-rounded)<1e-6?rounded:L.toFixed(8);
    
    document.getElementById('lim-result').innerHTML=`
      <div class="result">
        <div class="math">lim<sub>x→${aStr}</sub> f(x) = <strong>${final}</strong></div>
      </div>`;
    
    toast('Limite calculado!','ok');
  }catch(e){toast(e.message,'err');}
}

// Integral
function calcIntegral(){
  try{
    const f=str('int-f');
    const x1=num('int-x1'),x2=num('int-x2');
    const fn=x=>evalMath(f,{x:x});
    const n=1000,h=(x2-x1)/n;
    let s=fn(x1)+fn(x2);
    for(let i=1;i<n;i++)s+=fn(x1+i*h)*(i%2?4:2);
    const W=s*h/3;
    
    document.getElementById('int-result').innerHTML=`
      <div class="result">
        <div class="math">∫<sub>${x1}</sub><sup>${x2}</sup> ${f} dx = <strong>${W.toFixed(6)}</strong></div>
      </div>`;
    
    toast('Integral calculada!','ok');
  }catch(e){toast(e.message,'err');}
}

// Simuladores
function simMHS(){
  const A=num('mhs-a'),w=num('mhs-w'),p=num('mhs-p');
  const ts=Array.from({length:200},(_,i)=>i*0.1);
  const x=ts.map(t=>A*Math.cos(w*t+p));
  Plotly.newPlot('mhs-plot',[{x:ts,y:x,name:'x(t)',line:{color:'#4f46e5'}}],{title:'MHS'},{responsive:true});
}

function simObl(){
  const v0=num('obl-v'),ang=num('obl-a');
  const rad=ang*Math.PI/180,vx=v0*Math.cos(rad),vy=v0*Math.sin(rad),g=9.81;
  const tI=2*vy/g,ts=Array.from({length:200},(_,i)=>tI*i/199);
  const X=ts.map(t=>vx*t),Y=ts.map(t=>vy*t-0.5*g*t*t);
  Plotly.newPlot('obl-plot',[{x:X,y:Y,name:'Trajetória',line:{color:'#4f46e5'}}],{title:'Lançamento'},{responsive:true});
}
</script>
</body>
</html>
