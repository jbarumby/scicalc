<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 900">
<defs>
 <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fbfdff"/><stop offset="1" stop-color="#eef3f9"/></linearGradient>
 <linearGradient id="metal" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#718096"/><stop offset=".5" stop-color="#edf2f7"/><stop offset="1" stop-color="#718096"/></linearGradient>
 <marker id="arrowG" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10z" fill="#18a56b"/></marker>
 <marker id="arrowB" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10z" fill="#2563eb"/></marker>
 <marker id="arrowR" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10z" fill="#dc2626"/></marker>
</defs>
<rect width="1400" height="900" fill="url(#bg)"/>
<rect x="18" y="18" width="1364" height="410" rx="20" fill="#fff" stroke="#dbe4ef" stroke-width="2"/>
<text x="42" y="58" font-family="Arial" font-size="30" font-weight="700" fill="#174a91">Experimento 1 — Indução eletromagnética de Faraday</text>
<text x="42" y="88" font-family="Arial" font-size="17" fill="#334155">O movimento relativo entre o ímã e a bobina altera o fluxo magnético e produz uma fem induzida.</text>
<!-- magnet -->
<rect x="70" y="180" width="150" height="82" rx="6" fill="#2467a8"/><rect x="145" y="180" width="75" height="82" fill="#d33b3b"/>
<text x="92" y="232" font-family="Arial" font-size="30" font-weight="700" fill="white">S</text><text x="176" y="232" font-family="Arial" font-size="30" font-weight="700" fill="white">N</text>
<text x="112" y="290" font-family="Arial" font-size="19" font-weight="700" fill="#24304a">Ímã</text>
<line x1="105" y1="330" x2="275" y2="330" stroke="#18a56b" stroke-width="10" marker-end="url(#arrowG)"/>
<text x="115" y="365" font-family="Arial" font-size="17" font-weight="700" fill="#24304a">Movimento do ímã</text>
<!-- field lines -->
<g fill="none" stroke="#24b89a" stroke-width="3" opacity=".85">
<path d="M220 190 C320 135 390 130 485 175" marker-end="url(#arrowG)"/><path d="M220 210 C320 175 390 170 485 195" marker-end="url(#arrowG)"/><path d="M220 230 C320 220 390 215 485 215" marker-end="url(#arrowG)"/><path d="M220 250 C320 265 390 260 485 235" marker-end="url(#arrowG)"/><path d="M220 270 C320 315 390 310 485 255" marker-end="url(#arrowG)"/>
</g>
<!-- coil -->
<rect x="485" y="130" width="165" height="190" rx="10" fill="url(#metal)" stroke="#526174" stroke-width="3"/>
<g fill="none" stroke="#c56a18" stroke-width="7">
<ellipse cx="567" cy="145" rx="72" ry="15"/><ellipse cx="567" cy="168" rx="72" ry="15"/><ellipse cx="567" cy="191" rx="72" ry="15"/><ellipse cx="567" cy="214" rx="72" ry="15"/><ellipse cx="567" cy="237" rx="72" ry="15"/><ellipse cx="567" cy="260" rx="72" ry="15"/><ellipse cx="567" cy="283" rx="72" ry="15"/><ellipse cx="567" cy="306" rx="72" ry="15"/>
</g>
<text x="530" y="350" font-family="Arial" font-size="19" font-weight="700" fill="#24304a">Bobina (N espiras)</text>
<!-- circuit -->
<path d="M640 145 H790 V320 H640" fill="none" stroke="#a45a20" stroke-width="7"/>
<line x1="640" y1="145" x2="790" y2="145" stroke="#18a56b" stroke-width="4" marker-end="url(#arrowG)"/>
<text x="670" y="128" font-family="Arial" font-size="18" font-weight="700" fill="#24304a">Corrente induzida</text>
<!-- gauge -->
<circle cx="875" cy="230" r="82" fill="#f8fafc" stroke="#263442" stroke-width="6"/>
<circle cx="875" cy="230" r="8" fill="#263442"/><line x1="875" y1="230" x2="922" y2="188" stroke="#dc2626" stroke-width="7"/>
<text x="862" y="158" font-family="Arial" font-size="20" font-weight="700">0</text><text x="803" y="240" font-family="Arial" font-size="18">−1</text><text x="928" y="240" font-family="Arial" font-size="18">+1</text>
<text x="824" y="345" font-family="Arial" font-size="19" font-weight="700" fill="#24304a">Galvanômetro</text>
<!-- equations -->
<rect x="990" y="155" width="345" height="145" rx="18" fill="#fff5d9" stroke="#f0dfad"/>
<text x="1020" y="205" font-family="Georgia" font-size="29" fill="#24304a">ε = −N dΦ/dt</text>
<text x="1020" y="255" font-family="Georgia" font-size="27" fill="#24304a">Φ = BA cos θ</text>
<text x="1010" y="335" font-family="Arial" font-size="17" fill="#475569">Lei de Faraday–Lenz</text>
<!-- second panel -->
<rect x="18" y="450" width="1364" height="432" rx="20" fill="#fff" stroke="#dbe4ef" stroke-width="2"/>
<text x="42" y="492" font-family="Arial" font-size="30" font-weight="700" fill="#174a91">Experimento 2 — Lei de Lenz</text>
<text x="42" y="520" font-family="Arial" font-size="17" fill="#334155">A corrente induzida cria um campo que se opõe à variação do fluxo magnético.</text>
<!-- left -->
<rect x="42" y="545" width="640" height="310" rx="16" fill="#eef7ff"/>
<text x="250" y="578" font-family="Arial" font-size="22" font-weight="700" fill="#174a91">Aproximação do ímã</text>
<rect x="80" y="650" width="105" height="58" fill="#2467a8"/><rect x="132" y="650" width="53" height="58" fill="#d33b3b"/>
<text x="95" y="688" font-family="Arial" font-size="22" font-weight="700" fill="white">S</text><text x="151" y="688" font-family="Arial" font-size="22" font-weight="700" fill="white">N</text>
<line x1="115" y1="735" x2="285" y2="735" stroke="#18a56b" stroke-width="9" marker-end="url(#arrowG)"/>
<rect x="300" y="610" width="120" height="150" rx="10" fill="url(#metal)" stroke="#526174" stroke-width="3"/>
<g fill="none" stroke="#c56a18" stroke-width="5"><ellipse cx="360" cy="625" rx="53" ry="10"/><ellipse cx="360" cy="645" rx="53" ry="10"/><ellipse cx="360" cy="665" rx="53" ry="10"/><ellipse cx="360" cy="685" rx="53" ry="10"/><ellipse cx="360" cy="705" rx="53" ry="10"/><ellipse cx="360" cy="725" rx="53" ry="10"/><ellipse cx="360" cy="745" rx="53" ry="10"/></g>
<line x1="360" y1="610" x2="360" y2="565" stroke="#2563eb" stroke-width="8" marker-end="url(#arrowB)"/><text x="380" y="568" font-family="Arial" font-size="18" font-weight="700" fill="#174a91">B induzido</text>
<circle cx="535" cy="680" r="58" fill="#f8fafc" stroke="#263442" stroke-width="5"/><line x1="535" y1="680" x2="505" y2="650" stroke="#dc2626" stroke-width="6"/><text x="510" y="772" font-family="Arial" font-size="16" font-weight="700">Galvanômetro</text>
<text x="105" y="822" font-family="Arial" font-size="16" fill="#174a91">Fluxo aumenta → oposição à aproximação</text>
<!-- right -->
<rect x="718" y="545" width="640" height="310" rx="16" fill="#fff1f1"/>
<text x="925" y="578" font-family="Arial" font-size="22" font-weight="700" fill="#991b1b">Afastamento do ímã</text>
<rect x="756" y="650" width="105" height="58" fill="#2467a8"/><rect x="808" y="650" width="53" height="58" fill="#d33b3b"/>
<text x="771" y="688" font-family="Arial" font-size="22" font-weight="700" fill="white">S</text><text x="827" y="688" font-family="Arial" font-size="22" font-weight="700" fill="white">N</text>
<line x1="825" y1="735" x2="700" y2="735" stroke="#18a56b" stroke-width="9" marker-end="url(#arrowG)"/>
<rect x="976" y="610" width="120" height="150" rx="10" fill="url(#metal)" stroke="#526174" stroke-width="3"/>
<g fill="none" stroke="#c56a18" stroke-width="5"><ellipse cx="1036" cy="625" rx="53" ry="10"/><ellipse cx="1036" cy="645" rx="53" ry="10"/><ellipse cx="1036" cy="665" rx="53" ry="10"/><ellipse cx="1036" cy="685" rx="53" ry="10"/><ellipse cx="1036" cy="705" rx="53" ry="10"/><ellipse cx="1036" cy="725" rx="53" ry="10"/><ellipse cx="1036" cy="745" rx="53" ry="10"/></g>
<line x1="1036" y1="610" x2="1036" y2="565" stroke="#2563eb" stroke-width="8" marker-end="url(#arrowB)"/><text x="1056" y="568" font-family="Arial" font-size="18" font-weight="700" fill="#174a91">B induzido</text>
<circle cx="1210" cy="680" r="58" fill="#f8fafc" stroke="#263442" stroke-width="5"/><line x1="1210" y1="680" x2="1240" y2="650" stroke="#dc2626" stroke-width="6"/><text x="1184" y="772" font-family="Arial" font-size="16" font-weight="700">Galvanômetro</text>
<text x="795" y="822" font-family="Arial" font-size="16" fill="#991b1b">Fluxo diminui → oposição à diminuição</text>
</svg>