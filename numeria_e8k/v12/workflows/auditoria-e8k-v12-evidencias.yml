name: auditoria-e8k-v12-evidencias
on:
  workflow_dispatch:
  push:
    paths:
      - 'CONFERIR_E8K_V12_V2.py'
      - 'RESULTADO_E8K_V12.json'
      - 'SHA256SUMS.txt'
      - 'NUMERIA_E7_REVISAO_FORMAL_2026-10-26_3.zip'
      - 'proveniencia_b3/**'
      - '.github/workflows/auditoria-e8k-v12-evidencias.yml'
  pull_request:
    paths:
      - 'CONFERIR_E8K_V12_V2.py'
      - 'RESULTADO_E8K_V12.json'
      - 'SHA256SUMS.txt'
      - 'NUMERIA_E7_REVISAO_FORMAL_2026-10-26_3.zip'
      - 'proveniencia_b3/**'
      - '.github/workflows/auditoria-e8k-v12-evidencias.yml'
permissions:
  contents: read
jobs:
  conferir-evidencias:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Conferir manifesto original, 15.754 registros, B3 e somas E7
        run: |
          python CONFERIR_E8K_V12_V2.py \
            --root . \
            --out CONFERENCIA_E8K_V12_V2.json \
            --selftest
      - name: Publicar conferencia (mesmo em caso de falha)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: conferencia-independente-e8k-v12
          path: CONFERENCIA_E8K_V12_V2.json
          if-no-files-found: warn
