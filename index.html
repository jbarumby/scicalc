<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SciCalc Avançada — Redirecionando...</title>
  <meta http-equiv="refresh" content="0; url=./ciencia.html">
  <link rel="canonical" href="./ciencia.html">
  <script>
    window.location.replace('./ciencia.html' + window.location.search + window.location.hash);
  </script>
  <style>
    :root {
      --primary: #4f46e5;
      --bg: #f8fafc;
      --ink: #0f172a;
      --muted: #64748b;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #090d16;
        --ink: #f1f5f9;
        --muted: #94a3b8;
      }
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: var(--bg);
      color: var(--ink);
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      text-align: center;
    }
    .card {
      background: rgba(255, 255, 255, 0.8);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(128, 128, 128, 0.15);
      border-radius: 18px;
      padding: 36px 32px;
      max-width: 440px;
      width: 100%;
      box-shadow: 0 12px 32px rgba(0, 0, 0, 0.08);
    }
    .spinner {
      width: 40px;
      height: 40px;
      border: 3.5px solid rgba(79, 70, 229, 0.18);
      border-top-color: var(--primary);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 0 auto 20px;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    h1 {
      font-size: 1.35rem;
      font-weight: 700;
      margin-bottom: 8px;
    }
    p {
      color: var(--muted);
      font-size: 0.95rem;
      margin-bottom: 20px;
      line-height: 1.5;
    }
    a.btn {
      display: inline-block;
      padding: 10px 22px;
      background: linear-gradient(135deg, #4f46e5 0%, #7c3aed 100%);
      color: #fff;
      text-decoration: none;
      font-weight: 600;
      font-size: 0.92rem;
      border-radius: 10px;
      transition: transform 0.15s, opacity 0.2s;
    }
    a.btn:hover {
      opacity: 0.92;
      transform: translateY(-1px);
    }
  </style>
</head>
<body>
  <main class="card">
    <div class="spinner" aria-hidden="true"></div>
    <h1>🧮 SciCalc Avançada</h1>
    <p>Redirecionando para a plataforma principal de Matemática e Física...</p>
    <a class="btn" href="./ciencia.html">Acessar SciCalc diretamente →</a>
  </main>
</body>
</html>
